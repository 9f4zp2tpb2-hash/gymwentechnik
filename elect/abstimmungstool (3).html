<title>AgoraSessions</title>
<style>
  /* ==========================================================
     AgoraSessions — Bildsprache des Schullogos:
     Wachstums-/Fortschrittslinie über fünf Balkenfarben
     (Grün, Rot, Türkis, Orange, Blau).
     ========================================================== */
  :root{
    --bg:#f6f7f6;             /* Seitenhintergrund */
    --surface:#ffffff;        /* Kartenflächen */
    --surface-2:#eef0ee;      /* zweite Fläche */
    --ink:#20242a;
    --ink-soft:#5c626a;
    --line:#dde1de;
    --line-strong:#20242a;

    --blue:#4b83a4;           /* Primärfarbe: Aktionen */
    --blue-deep:#355f7d;
    --teal:#5eabb3;           /* läuft gerade */
    --teal-deep:#2f6169;
    --green:#668d4e;          /* erledigt / positiv */
    --green-deep:#4a6939;
    --orange:#d26c46;         /* Hinweis */
    --orange-deep:#a44b2c;
    --maroon:#ae3336;         /* löschen / Fehler */
    --maroon-deep:#7e2224;

    --tint-blue:#e6eef3;
    --tint-teal:#e6f2f3;
    --tint-green:#eef2ea;
    --tint-orange:#faeae3;
    --tint-maroon:#f7e3e2;

    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family: "Segoe UI", ui-sans-serif, Calibri, Roboto, Arial, sans-serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2,h3{
    font-family: inherit;
    font-weight:700;
    margin:0 0 .3em 0;
    letter-spacing:-.2px;
    color:var(--ink);
  }
  h1{font-size:1.65rem;}
  h2{font-size:1.24rem;}
  h3{font-size:1.02rem;}
  p{margin:.3em 0;max-width:62ch;}
  a{color:var(--blue-deep);}
  .muted{color:var(--ink-soft);}
  .serial{font-family:"SFMono-Regular", Consolas, Menlo, monospace; letter-spacing:.5px;}

  #app{max-width:960px;margin:0 auto;padding:2.2rem 1.4rem 4rem;}

  /* ---- Masthead: Schullogo + Wortmarke ---- */
  .masthead{display:flex;align-items:center;gap:.9rem;margin-bottom:0;}
  .masthead .brand-logo{border-radius:11px;display:block;flex-shrink:0;box-shadow:0 0 0 1px rgba(0,0,0,.06);}
  .masthead h1{margin:0;}
  .masthead .tag{font-size:.82rem;color:var(--ink-soft);margin-top:.1rem;}
  .colonnade{
    height:5px;margin:1rem 0 2rem;border-radius:3px;overflow:hidden;
    background:linear-gradient(90deg,
      var(--teal) 0 20%, var(--orange) 20% 40%, var(--blue) 40% 60%,
      var(--green) 60% 80%, var(--maroon) 80% 100%);
  }

  .card{
    border:1px solid var(--line);
    background:var(--surface);
    padding:1.4rem 1.5rem;
    margin-bottom:1.2rem;
    border-radius:10px;
    box-shadow:0 1px 2px rgba(20,24,30,.04);
  }
  .card.accent-left{border-left:4px solid var(--blue);}
  .card.live{border-left:4px solid var(--teal);}
  .card.done{border-left:4px solid var(--green);}

  .row{display:flex;gap:.8rem;flex-wrap:wrap;}
  .row > *{flex:1;min-width:180px;}

  label{display:block;font-size:.85rem;color:var(--ink-soft);margin:.7rem 0 .25rem;}
  input[type=text],input[type=number],input[type=password],input[type=email],select,textarea{
    width:100%;padding:.55rem .6rem;border:1px solid var(--line);
    background:var(--bg);color:var(--ink);font-size:1rem;font-family:inherit;
    border-radius:7px;
  }
  input:focus,select:focus,textarea:focus,button:focus{
    outline:2px solid var(--blue);outline-offset:1px;
  }
  button{
    font-family:inherit;font-size:.92rem;padding:.6rem 1.15rem;
    border:1px solid var(--line-strong);background:var(--ink);color:#fff;
    cursor:pointer;border-radius:7px;letter-spacing:.1px;
  }
  button:hover{background:#000;}
  button.secondary{background:transparent;color:var(--ink);}
  button.secondary:hover{background:var(--surface-2);}
  button.accent{background:var(--blue-deep);border-color:var(--blue-deep);}
  button.accent:hover{background:var(--blue);}
  button.live-btn{background:var(--teal-deep);border-color:var(--teal-deep);}
  button.live-btn:hover{background:var(--teal);}
  button.danger{background:var(--maroon-deep);border-color:var(--maroon-deep);}
  button.danger:hover{background:var(--maroon);}
  button.ghost{background:transparent;color:var(--blue-deep);border:none;padding:.2rem .3rem;text-decoration:underline;border-radius:0;}
  button.ghost.danger-text{color:var(--maroon-deep);}
  button:disabled{opacity:.4;cursor:not-allowed;}
  .btnbar{display:flex;gap:.5rem;flex-wrap:wrap;margin-top:.6rem;}

  .status-badge{
    display:inline-block;font-size:.72rem;padding:.18rem .6rem;border-radius:99px;border:1px solid transparent;
  }
  .status-open,.status-active{background:var(--teal-deep);color:#fff;}
  .status-closed{background:var(--blue-deep);color:#fff;}
  .status-draft,.status-setup{background:var(--surface-2);color:var(--ink-soft);border-color:var(--line);}

  .notice{padding:.8rem 1rem;border:1px solid var(--orange);background:var(--tint-orange);color:var(--orange-deep);margin:.8rem 0;font-size:.92rem;border-radius:8px;}
  .error{padding:.8rem 1rem;border:1px solid var(--maroon);background:var(--tint-maroon);color:var(--maroon-deep);margin:.8rem 0;font-size:.92rem;border-radius:8px;}

  .bar-row{display:flex;align-items:center;gap:.6rem;margin:.35rem 0;}
  .bar-label{width:35%;font-size:.9rem;}
  .bar-track{flex:1;background:var(--surface-2);height:1.4rem;position:relative;border:1px solid var(--line);border-radius:5px;overflow:hidden;}
  .bar-fill{background:var(--blue);height:100%;}
  .bar-count{width:3.5rem;text-align:right;font-size:.85rem;font-family:monospace;}

  .hidden{display:none !important;}

  .choice{
    display:flex;align-items:center;gap:.6rem;border:1px solid var(--line);
    padding:.7rem .8rem;margin:.4rem 0;cursor:pointer;background:var(--surface);border-radius:8px;
  }
  .choice:hover{border-color:var(--blue);}
  .choice.selected{border-color:var(--blue);background:var(--tint-blue);}
  .choice input{width:auto;}

  table{width:100%;border-collapse:collapse;font-size:.92rem;}
  th,td{text-align:left;padding:.4rem .5rem;border-bottom:1px solid var(--line);}
  th{color:var(--ink-soft);font-weight:600;font-size:.78rem;}
  td.actions-cell{white-space:nowrap;}

  footer.sysfoot{margin-top:2.5rem;padding-top:1rem;border-top:1px solid var(--line);font-size:.78rem;color:var(--ink-soft);}

  /* ---- Modal / Bestätigungsfenster ---- */
  .modal-overlay{
    position:fixed;inset:0;background:rgba(20,24,30,.45);
    display:flex;align-items:center;justify-content:center;padding:1rem;z-index:1000;
  }
  .modal-box{
    background:var(--surface);border-radius:12px;padding:1.4rem 1.5rem;
    max-width:420px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,.25);
  }
  .modal-box h3{margin-bottom:.5rem;}
  .modal-box p{max-width:none;}

  /* ---- Druckbogen: Zugangscode-Karten ---- */
  #print-sheet{display:none;}
  .print-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0;}
  .print-card{
    position:relative;
    border:1.5px dashed #9aa39f;
    padding:20px 10px 14px;
    text-align:center;
    display:flex;flex-direction:column;justify-content:center;gap:6px;
    min-height:128px;margin:-1px 0 0 -1px;
    background:#fff;
  }
  .print-card::before{
    content:"";position:absolute;top:0;left:0;right:0;height:5px;
    background:linear-gradient(90deg, var(--teal), var(--orange), var(--blue), var(--green), var(--maroon));
  }
  .print-card .pc-session{font-size:.72rem;color:#555;}
  .print-card .pc-token{font-size:1.15rem;font-weight:700;font-family:"SFMono-Regular",Consolas,monospace;letter-spacing:1px;}
  .print-card .pc-hint{font-size:.62rem;color:#888;}

  @media print{
    body *{visibility:hidden;}
    #print-sheet, #print-sheet *{visibility:visible;}
    #print-sheet{display:block;position:absolute;top:0;left:0;width:100%;}
    #app{display:none;}
  }
</style>
</head>
<body>

<script>

/* =========================================================================
   2) HILFSFUNKTIONEN
   ========================================================================= */
function randomDigits(n){
  const arr = new Uint32Array(n);
  crypto.getRandomValues(arr);
  return Array.from(arr, x => x % 10).join('');
}
async function sha256Hex(text){
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(text));
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
}
function formatToken(token){
  return token.replace(/(.{5})/g, '$1-').replace(/-$/, '');
}
function cleanToken(input){
  return (input || '').replace(/[^0-9]/g, '');
}
function chunk(arr, size){
  const out = [];
  for(let i=0;i<arr.length;i+=size) out.push(arr.slice(i, i+size));
  return out;
}
/* Wiederholt eine asynchrone Firebase-Operation bei kurzzeitigen Netz-/
   Serverproblemen (z. B. viele gleichzeitige Zugriffe in einer großen
   Sitzung). Bricht sofort ab bei Fehlern, die kein erneuter Versuch löst
   (z. B. fehlende Berechtigung, ungültiger Token). */
async function withRetry(fn, { attempts = 4, baseDelayMs = 400 } = {}){
  const retryableCodes = new Set(['unavailable','deadline-exceeded','resource-exhausted','aborted','cancelled','internal']);
  let lastErr;
  for(let i=0;i<attempts;i++){
    try{
      return await fn();
    }catch(e){
      lastErr = e;
      const code = e && e.code ? e.code.replace('firestore/','').replace('auth/','') : '';
      if(!retryableCodes.has(code) || i === attempts-1) throw e;
      await new Promise(r => setTimeout(r, baseDelayMs * Math.pow(2, i) + Math.random()*150));
    }
  }
  throw lastErr;
}
function friendlyFirebaseError(e){
  const code = e && e.code ? e.code.replace('firestore/','').replace('auth/','') : '';
  if(code === 'resource-exhausted') return 'Das Projekt hat sein Firebase-Nutzungslimit für heute erreicht (Spark-Tarif). Bitte im Firebase-Projekt auf den Blaze-Tarif wechseln oder morgen erneut versuchen.';
  if(code === 'unavailable' || code === 'deadline-exceeded') return 'Verbindung derzeit instabil. Bitte kurz warten und erneut versuchen.';
  if(code === 'permission-denied') return 'Zugriff verweigert. Bitte Firestore-Sicherheitsregeln prüfen.';
  if(code === 'too-many-requests') return 'Zu viele Anmeldeversuche kurz hintereinander. Bitte kurz warten und erneut versuchen.';
  return (e && e.message) ? e.message : 'Unbekannter Fehler.';
}
async function generateUniqueSessionNumber(){
  for(let i=0;i<20;i++){
    const num = randomDigits(6);
    const doc = await db.collection('sessions').doc(num).get();
    if(!doc.exists) return num;
  }
  throw new Error('Konnte keine freie Sitzungsnummer erzeugen. Bitte erneut versuchen.');
}
function el(html){
  const t = document.createElement('template');
  t.innerHTML = html.trim();
  return t.content.firstElementChild;
}
function fmtDate(ts){
  if(!ts || !ts.toDate) return '–';
  return ts.toDate().toLocaleString('de-DE');
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

const root = document.getElementById('root');
const mastheadTag = document.getElementById('masthead-tag');

/* =========================================================================
   3) STATE / ROUTING
   ========================================================================= */
const state = {
  view: 'start',        // start | p-login | p-vote | m-login | m-dashboard | m-session
  managerProfile: null, // {uid,email,role}
  participant: null,    // {sessionNumber, uid}
  currentSessionId: null,
  unsub: []             // aktive onSnapshot-Abmeldefunktionen
};

function clearSubs(){
  state.unsub.forEach(fn => { try{ fn(); }catch(e){} });
  state.unsub = [];
}
function goto(view){
  clearSubs();
  state.view = view;
  render();
}

auth.onAuthStateChanged(async (user) => {
  if(!user){
    state.managerProfile = null;
    state.participant = null;
    if(state.view !== 'start') goto('start'); else render();
    return;
  }
  if(user.isAnonymous){
    const saved = localStorage.getItem('participantSession');
    if(saved){
      state.participant = JSON.parse(saved);
      goto('p-vote');
    } else {
      goto('p-login');
    }
  } else {
    try{
      const doc = await db.collection('managers').doc(user.uid).get();
      if(!doc.exists){
        await auth.signOut();
        goto('m-login');
        return;
      }
      state.managerProfile = { uid:user.uid, ...doc.data() };
      goto('m-dashboard');
    }catch(e){
      console.error(e);
      goto('m-login');
    }
  }
});

/* =========================================================================
   4) RENDER
   ========================================================================= */
function render(){
  mastheadTag.textContent =
    state.view.startsWith('p-') ? 'Teilnehmer-Anmeldung' :
    state.view.startsWith('m-') ? 'Wahlmanager-Bereich' : 'Sitzungsgebundene Abstimmungen';

  if(state.view === 'start') return renderStart();
  if(state.view === 'p-login') return renderParticipantLogin();
  if(state.view === 'p-vote') return renderParticipantVote();
  if(state.view === 'm-login') return renderManagerLogin();
  if(state.view === 'm-dashboard') return renderManagerDashboard();
  if(state.view === 'm-session') return renderSessionDetail();
}

function renderStart(){
  root.innerHTML = '';
  root.appendChild(el(`
    <div class="row">
      <div class="card accent-left">
        <h2>Ich bin Teilnehmer</h2>
        <p class="muted">Melde dich mit deiner Sitzungsnummer und deinem persönlichen Zugangscode an.</p>
        <div class="btnbar"><button class="accent" id="go-p">Zur Anmeldung</button></div>
      </div>
      <div class="card">
        <h2>Ich bin Wahlmanager</h2>
        <p class="muted">Anmeldung mit E-Mail und Passwort, um Sitzungen und Abstimmungen zu verwalten.</p>
        <div class="btnbar"><button class="secondary" id="go-m">Zur Anmeldung</button></div>
      </div>
    </div>
  `));
  document.getElementById('go-p').onclick = () => goto('p-login');
  document.getElementById('go-m').onclick = () => goto('m-login');
}

/* ---------- Teilnehmer: Login ---------- */
function renderParticipantLogin(){
  root.innerHTML = '';
  const card = el(`
    <div class="card accent-left">
      <h2>Anmeldung zur Abstimmung</h2>
      <label>Sitzungsnummer</label>
      <input type="text" id="in-session" inputmode="numeric" maxlength="6" placeholder="z. B. 384012">
      <label>Zugangscode (Token)</label>
      <input type="text" id="in-token" placeholder="z. B. 12345-67890-12345">
      <div id="p-error"></div>
      <div class="btnbar">
        <button class="accent" id="btn-login">Anmelden</button>
        <button class="secondary" id="btn-back">Zurück</button>
      </div>
    </div>
  `);
  root.appendChild(card);
  document.getElementById('btn-back').onclick = () => goto('start');
  document.getElementById('btn-login').onclick = doParticipantLogin;
}

async function doParticipantLogin(){
  const errBox = document.getElementById('p-error');
  errBox.innerHTML = '';
  const sessionNumber = cleanToken(document.getElementById('in-session').value).slice(0,6);
  const token = cleanToken(document.getElementById('in-token').value);
  if(sessionNumber.length !== 6 || token.length !== 15){
    errBox.appendChild(el(`<div class="error">Bitte Sitzungsnummer (6-stellig) und Zugangscode (15-stellig) vollständig eingeben.</div>`));
    return;
  }
  const btn = document.getElementById('btn-login');
  btn.disabled = true;
  try{
    // Wichtig: zuerst anmelden, danach erst lesen. Die Sicherheitsregeln
    // verlangen für jeden Lesezugriff einen angemeldeten Nutzer (auch
    // anonym) — wer das hier vertauscht, bekommt bei jedem komplett neuen
    // Teilnehmer "permission-denied", weil zum Zeitpunkt des Lesens noch
    // keine Anmeldung stattgefunden hat.
    if(!auth.currentUser){
      await withRetry(() => auth.signInAnonymously());
    }
    const sessionDoc = await withRetry(() => db.collection('sessions').doc(sessionNumber).get());
    if(!sessionDoc.exists){
      errBox.appendChild(el(`<div class="error">Unbekannte Sitzungsnummer.</div>`));
      btn.disabled = false;
      return;
    }
    const uid = auth.currentUser.uid;
    const tokenHash = await sha256Hex(token);
    const tokenRef = db.collection('sessions').doc(sessionNumber).collection('tokens').doc(tokenHash);

    // Transaktion statt einfachem Schreiben: garantiert, dass bei vielen
    // gleichzeitigen Anmeldungen niemals zwei Geräte denselben Token als
    // "frei" vorfinden — Firestore serialisiert konkurrierende Zugriffe auf
    // dasselbe Token-Dokument automatisch und wiederholt sie bei Bedarf.
    await withRetry(() => db.runTransaction(async (tx) => {
      const tokenDoc = await tx.get(tokenRef);
      if(!tokenDoc.exists){
        throw new Error('invalid-token');
      }
      const data = tokenDoc.data();
      if(data.used && data.usedByUid !== uid){
        throw new Error('token-used');
      }
      if(!data.used){
        tx.update(tokenRef, { used:true, usedByUid: uid, usedAt: FieldValue.serverTimestamp() });
      }
    }));

    state.participant = { sessionNumber, uid };
    localStorage.setItem('participantSession', JSON.stringify(state.participant));
    goto('p-vote');
  }catch(e){
    console.error(e);
    if(e.message === 'invalid-token'){
      errBox.appendChild(el(`<div class="error">Ungültiger Zugangscode für diese Sitzung.</div>`));
    } else if(e.message === 'token-used'){
      errBox.appendChild(el(`<div class="error">Dieser Zugangscode wurde bereits auf einem anderen Gerät verwendet.</div>`));
    } else {
      errBox.appendChild(el(`<div class="error">Anmeldung fehlgeschlagen: ${escapeHtml(friendlyFirebaseError(e))}</div>`));
    }
  }
  btn.disabled = false;
}

function renderParticipantVote(){

  };

  const sessionRef = db.collection('sessions').doc(sessionNumber);
  let slideUnsub = null;

  const sessUnsub = sessionRef.onSnapshot(sessionSnap => {
    if(slideUnsub){ slideUnsub(); slideUnsub = null; }
    const sdata = sessionSnap.data();
    const area = document.getElementById('slide-area');
    if(!sdata || !sdata.currentSlideId){
      area.innerHTML = '<p class="muted">Es ist aktuell keine Abstimmung geöffnet. Bitte warten.</p>';

      await renderSlideForParticipant(sessionNumber, slideSnap.id, slideSnap.data());
    });
  });
  state.unsub.push(sessUnsub, () => { if(slideUnsub) slideUnsub(); });
}

async function renderSlideForParticipant(sessionNumber, slideId, slide){
  const area = document.getElementById('slide-area');
  if(!area) return;
  const uid = auth.currentUser.uid;
  const votersRef = db.collection('sessions').doc(sessionNumber)
    .collection('slides').doc(slideId).collection('voters').doc(uid);
  const votedDoc = await votersRef.get();
  const alreadyVoted = votedDoc.exists;

  let html = `<h3>${escapeHtml(slide.question)}</h3>`;
  if(slide.status === 'draft'){
    html += `<p class="muted">Diese Frage ist noch nicht geöffnet.</p>`;
    area.innerHTML = html;
    return;
  }
  if(slide.status === 'open' && !alreadyVoted){
    html += `<div id="choices"></div><div class="btnbar"><button class="accent" id="submit-vote" disabled>Stimme abgeben</button></div><div id="vote-error"></div>`;
    area.innerHTML = html;
    const choicesBox = document.getElementById('choices');
    const selected = new Set();
    const multi = slide.type === 'multiple';
    slide.options.forEach((opt, idx) => {
      const row = el(`<div class="choice" data-idx="${idx}">
        <input type="${multi ? 'checkbox' : 'radio'}" name="opt" ${multi ? '' : 'name="opt-radio"'}>
        <span>${escapeHtml(opt)}</span>
      </div>`);
      row.onclick = () => {
        if(multi){
          row.classList.toggle('selected');
          row.querySelector('input').checked = row.classList.contains('selected');
          if(row.classList.contains('selected')) selected.add(idx); else selected.delete(idx);
        } else {
          choicesBox.querySelectorAll('.choice').forEach(r => { r.classList.remove('selected'); r.querySelector('input').checked = false; });
          row.classList.add('selected');
          row.querySelector('input').checked = true;
          selected.clear(); selected.add(idx);
        }
        document.getElementById('submit-vote').disabled = selected.size === 0;
      };
      choicesBox.appendChild(row);
    });
    document.getElementById('submit-vote').onclick = async () => {
      const btn = document.getElementById('submit-vote');
      btn.disabled = true;
      try{
        await castVote(sessionNumber, slideId, Array.from(selected));
        await renderSlideForParticipant(sessionNumber, slideId, slide);
      }catch(e){
        console.error(e);
        const msg = e.message === 'already-voted'
          ? 'Es liegt bereits eine Stimme von dir für diese Abstimmung vor.'
          : friendlyFirebaseError(e);
        document.getElementById('vote-error').innerHTML = `<div class="error">${escapeHtml(msg)}</div>`;
        btn.disabled = false;
      }
    };
    return;
  }
  if(slide.status === 'open' && alreadyVoted){
    html += `<p class="muted">Danke, deine Stimme wurde gezählt. Warte auf das Ende der Abstimmung.</p>`;
    area.innerHTML = html;
    return;
  }
  // closed
  html += `<p class="muted">Diese Abstimmung ist beendet.</p>`;
  if(slide.showResults){
    html += `<div id="results"></div>`;
    area.innerHTML = html;
    attachResultsListener(sessionNumber, slideId, slide, 'results');
  } else {
    area.innerHTML = html;
  }
}

async function castVote(sessionNumber, slideId, optionIndices){
  const slideRef = db.collection('sessions').doc(sessionNumber).collection('slides').doc(slideId);
  const uid = auth.currentUser.uid;
  const votersRef = slideRef.collection('voters').doc(uid);
  const voteRef = slideRef.collection('votes').doc(); // zufällige ID, keine Verknüpfung zur Person

  // Transaktion statt Batch: liest zuerst, ob diese Person schon abgestimmt
  // hat, und schreibt nur, wenn das (noch) nicht der Fall ist — alles in
  // einem serverseitig atomaren Schritt. Ein Doppelklick oder ein doppelt
  // abgeschickter Request kann so niemals zwei Stimmen erzeugen, auch wenn
  // tausende Personen gleichzeitig auf verschiedenen Geräten abstimmen
  // (jede Transaktion betrifft nur die Dokumente der eigenen Person).
  await withRetry(() => db.runTransaction(async (tx) => {
    const voterSnap = await tx.get(votersRef);
    if(voterSnap.exists){
      throw new Error('already-voted');
    }
    tx.set(votersRef, { votedAt: FieldValue.serverTimestamp() });
    tx.set(voteRef, { options: optionIndices, castAt: FieldValue.serverTimestamp() });
  }), { attempts: 3 });
}

function attachResultsListener(sessionNumber, slideId, slide, targetId){
  const votesRef = db.collection('sessions').doc(sessionNumber)
    .collection('slides').doc(slideId).collection('votes');
  const unsub = votesRef.onSnapshot(snap => {
    const counts = new Array(slide.options.length).fill(0);
    let total = 0;
    snap.forEach(d => {
      const opts = d.data().options || [];
      opts.forEach(i => { if(counts[i] !== undefined) counts[i]++; });
      total++;
    });
    const box = document.getElementById(targetId);
    if(!box) return;
    box.innerHTML = slide.options.map((opt,i) => {
      const pct = total ? Math.round((counts[i]/total)*100) : 0;
      return `<div class="bar-row">
        <div class="bar-label">${escapeHtml(opt)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
        <div class="bar-count">${counts[i]} (${pct}%)</div>
      </div>`;
    }).join('') + `<p class="muted">Abgegebene Stimmen: ${total}</p>`;
  });
  state.unsub.push(unsub);
}

async function doCreateSession(){
  const title = document.getElementById('new-title').value.trim() || 'Ohne Titel';
  const count = Math.max(1, Math.min(5000, parseInt(document.getElementById('new-count').value, 10) || 0));
  const statusBox = document.getElementById('create-status');
  statusBox.innerHTML = '<p class="muted">Erzeuge Sitzung …</p>';
  const btn = document.getElementById('create-session');
  btn.disabled = true;
  try{
    const sessionNumber = await withRetry(() => generateUniqueSessionNumber());
    await withRetry(() => db.collection('sessions').doc(sessionNumber).set({
      title, participantCount: count, status: 'setup',
      currentSlideId: null, createdAt: FieldValue.serverTimestamp(),
      createdBy: auth.currentUser.uid
    }));

    // 1) Tokens erzeugen und in Chunks parallel hashen (schnell, auch bei
    //    tausenden Teilnehmern) — der Klartext bleibt dabei nur im Browser.
    const plainTokens = Array.from({length: count}, () => randomDigits(15));
    const tokensCol = db.collection('sessions').doc(sessionNumber).collection('tokens');
    const hashChunks = chunk(plainTokens, 400);
    const writeChunks = [];
    for(let i=0;i<hashChunks.length;i++){
      statusBox.innerHTML = `<p class="muted">Erzeuge Zugangscodes … (${Math.min((i+1)*400, count)} / ${count})</p>`;
      const hashes = await Promise.all(hashChunks[i].map(sha256Hex));
      writeChunks.push(hashes);
    }

    // 2) Schreiben in Batches von je max. 450 Schreibvorgängen (Firestore
    //    erlaubt bis zu 500 pro Batch) — jede Batch wird bei kurzzeitigen
    //    Netz-/Serverfehlern automatisch erneut versucht, statt die ganze
    //    Sitzungserstellung abzubrechen.
    let done = 0;
    for(const hashes of writeChunks){
      let batch = db.batch();
      let opsInBatch = 0;
      for(const hash of hashes){
        batch.set(tokensCol.doc(hash), { used:false, createdAt: FieldValue.serverTimestamp() });
        opsInBatch++;
        if(opsInBatch >= 450){
          await withRetry(() => batch.commit());
          batch = db.batch();
          opsInBatch = 0;
        }
      }
      if(opsInBatch > 0) await withRetry(() => batch.commit());
      done += hashes.length;
      statusBox.innerHTML = `<p class="muted">Speichere Zugangscodes … (${done} / ${count})</p>`;
    }

    statusBox.innerHTML = '';
    statusBox.appendChild(el(`<div class="notice">
      Sitzung <strong>${sessionNumber}</strong> mit ${count} Zugangscodes wurde angelegt.
      Diese Codes werden aus Sicherheitsgründen nur <strong>jetzt einmalig</strong> im Klartext angezeigt –
      danach kennt das System nur noch eine nicht umkehrbare Prüfsumme davon. Bitte jetzt drucken oder exportieren.
    </div>`));
    const btnRow = el(`<div class="btnbar"></div>`);
    const printBtn = el(`<button class="accent">Zugangscode-Blatt drucken / als PDF speichern</button>`);
    printBtn.onclick = () => openPrintSheet(sessionNumber, title, plainTokens);
    btnRow.appendChild(printBtn);
    statusBox.appendChild(btnRow);

    document.getElementById('new-title').value = '';
  }catch(e){
    console.error(e);
    statusBox.innerHTML = '<div class="error">Sitzung konnte nicht angelegt werden: ' + escapeHtml(friendlyFirebaseError(e)) + '</div>';
  }
  btn.disabled = false;
}

    statusBox.innerHTML = '<div class="notice">Frage hinzugefügt.</div>';
  };

  const printRow = el(`<div class="btnbar"><button class="secondary" id="reprint-hint">Zugangscode-Blatt erneut drucken</button></div>`);
  printRow.querySelector('#reprint-hint').onclick = () => {
    alert('Aus Sicherheitsgründen speichert das System keine Klartext-Zugangscodes. Ein erneuter Druck ist nach dem Anlegen der Sitzung nicht mehr möglich. Bitte das Blatt beim Anlegen einer Sitzung direkt drucken/exportieren.');
  };
  root.appendChild(printRow);

  const slidesWrap = el(`<div id="slides-wrap"></div>`);
  root.appendChild(slidesWrap);

  const sessionRef = db.collection('sessions').doc(sessionId);
  const metaUnsub = sessionRef.onSnapshot(snap => {
    const d = snap.data();
    if(!d) return;
    document.getElementById('sd-title').textContent = `${d.title} — Sitzung ${sessionId}`;
    document.getElementById('sd-meta').textContent = `${d.participantCount} Teilnehmer · Status: ${d.status}`;
  });

  const slidesUnsub = sessionRef.collection('slides').orderBy('order').onSnapshot(snap => {
    slidesWrap.innerHTML = '';
    snap.forEach(doc => {
      slidesWrap.appendChild(renderSlideManagerCard(sessionId, doc.id, doc.data(), sessionRef));
    });
  });
  state.unsub.push(metaUnsub, slidesUnsub);
}

function renderSlideManagerCard(sessionId, slideId, slide, sessionRef){
  const statusClass = slide.status === 'open' ? 'live' : (slide.status === 'closed' ? 'done' : '');
  const card = el(`
    <div class="card ${statusClass}">
      <div class="row" style="align-items:center;">
        <h3 style="margin:0;">${escapeHtml(slide.question)}</h3>
        <span class="status-badge status-${slide.status}">${slide.status}</span>
      </div>
      <p class="muted">${slide.type === 'multiple' ? 'Mehrfachauswahl' : 'Einfachauswahl'} · ${slide.options.length} Optionen</p>
      <div class="btnbar" id="sl-actions-${slideId}"></div>
      <div id="sl-results-${slideId}"></div>
    </div>
  `);
  const actions = card.querySelector(`#sl-actions-${slideId}`);

  if(slide.status !== 'open'){
    const openBtn = el(`<button class="live-btn">Abstimmung öffnen</button>`);
    openBtn.onclick = () => openSlideForVoting(sessionId, slideId, sessionRef);
    actions.appendChild(openBtn);
  }
  if(slide.status === 'open'){
    const closeBtn = el(`<button class="secondary">Abstimmung schließen</button>`);
    closeBtn.onclick = () => db.collection('sessions').doc(sessionId).collection('slides').doc(slideId).update({status:'closed'});
    actions.appendChild(closeBtn);
  }
  if(slide.status === 'closed'){
    const toggleBtn = el(`<button class="secondary">${slide.showResults ? 'Ergebnis für Teilnehmer verbergen' : 'Ergebnis für Teilnehmer freigeben'}</button>`);
    toggleBtn.onclick = () => db.collection('sessions').doc(sessionId).collection('slides').doc(slideId).update({showResults: !slide.showResults});
    actions.appendChild(toggleBtn);
  }

  const delSlideBtn = el(`<button class="ghost danger-text">Frage löschen</button>`);
  delSlideBtn.onclick = async () => {
    const ok = await confirmDialog({
      title: 'Frage endgültig löschen?',
      messageHtml: `Die Frage „<strong>${escapeHtml(slide.question)}</strong>“ wird
        inklusive aller abgegebenen Stimmen <strong>unwiderruflich</strong> gelöscht.`,
      confirmLabel: 'Endgültig löschen'
    });
    if(!ok) return;
    delSlideBtn.disabled = true;
    try{
      await deleteSlideDeep(sessionRef, slideId);
    }catch(e){
      console.error(e);
      alert('Löschen fehlgeschlagen: ' + friendlyFirebaseError(e));
      delSlideBtn.disabled = false;
    }
  };
  actions.appendChild(delSlideBtn);

  // Live-Ergebnisanzeige für den Wahlmanager (immer sichtbar)
  const resultsUnsub = db.collection('sessions').doc(sessionId).collection('slides').doc(slideId)
    .collection('votes').onSnapshot(snap => {
      const counts = new Array(slide.options.length).fill(0);
      let total = 0;
      snap.forEach(d => {
        (d.data().options||[]).forEach(i => { if(counts[i]!==undefined) counts[i]++; });
        total++;
      });
      const box = card.querySelector(`#sl-results-${slideId}`);
      if(!box) return;
      box.innerHTML = slide.options.map((opt,i) => {
        const pct = total ? Math.round((counts[i]/total)*100) : 0;
        return `<div class="bar-row">
          <div class="bar-label">${escapeHtml(opt)}</div>
          <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
          <div class="bar-count">${counts[i]} (${pct}%)</div>
        </div>`;
      }).join('') + `<p class="muted">Abgegebene Stimmen: ${total}</p>`;
    });
  state.unsub.push(resultsUnsub);

  return card;
}

async function openSlideForVoting(sessionId, slideId, sessionRef){
  const slidesCol = sessionRef.collection('slides');
  const openSnap = await slidesCol.where('status','==','open').get();
  const batch = db.batch();
  openSnap.forEach(d => batch.update(d.ref, { status:'closed' }));
  batch.update(slidesCol.doc(slideId), { status:'open' });
  batch.update(sessionRef, { currentSlideId: slideId, status:'active' });
  await batch.commit();
}

/* =========================================================================
   5) LÖSCHEN — mit Bestätigungsfenster
   ========================================================================= */

/* Zeigt ein Bestätigungsfenster und gibt true/false zurück, je nachdem
   ob bestätigt oder abgebrochen wurde. */
function confirmDialog({ title = 'Bitte bestätigen', messageHtml = '', confirmLabel = 'Löschen', cancelLabel = 'Abbrechen', danger = true } = {}){
  return new Promise((resolve) => {
    const overlay = el(`
      <div class="modal-overlay">
        <div class="modal-box">
          <h3>${escapeHtml(title)}</h3>
          <p>${messageHtml}</p>
          <div class="btnbar" style="justify-content:flex-end;">
            <button class="secondary" data-a="cancel">${escapeHtml(cancelLabel)}</button>
            <button class="${danger ? 'danger' : 'accent'}" data-a="confirm">${escapeHtml(confirmLabel)}</button>
          </div>
        </div>
      </div>
    `);
    function finish(result){
      overlay.remove();
      document.removeEventListener('keydown', onKey);
      resolve(result);
    }
    function onKey(e){ if(e.key === 'Escape') finish(false); }
    overlay.addEventListener('click', (e) => { if(e.target === overlay) finish(false); });
    overlay.querySelector('[data-a="cancel"]').onclick = () => finish(false);
    overlay.querySelector('[data-a="confirm"]').onclick = () => finish(true);
    document.addEventListener('keydown', onKey);
    document.body.appendChild(overlay);
  });
}

/* Löscht alle Dokumente einer (potenziell großen) Sammlung in Blöcken,
   damit auch mehrere tausend Zugangscodes/Stimmen zuverlässig entfernt
   werden, ohne den Client oder eine einzelne Batch zu überlasten. */
async function deleteCollectionDocs(collRef, batchSize = 450){
  for(;;){
    const snap = await withRetry(() => collRef.limit(batchSize).get());
    if(snap.empty) return;
    const batch = db.batch();
    snap.forEach(d => batch.delete(d.ref));
    await withRetry(() => batch.commit());
    if(snap.size < batchSize) return;
  }
}

/* Löscht eine Frage/Abstimmung vollständig, inklusive aller Stimmen und
   Teilnahme-Markierungen. War sie gerade die aktive Frage der Sitzung,
   wird die Sitzung wieder auf "keine offene Abstimmung" zurückgesetzt. */
async function deleteSlideDeep(sessionRef, slideId){
  const slideRef = sessionRef.collection('slides').doc(slideId);
  await deleteCollectionDocs(slideRef.collection('votes'));
  await deleteCollectionDocs(slideRef.collection('voters'));
  await withRetry(() => slideRef.delete());
  const sSnap = await withRetry(() => sessionRef.get());
  if(sSnap.exists && sSnap.data().currentSlideId === slideId){
    await withRetry(() => sessionRef.update({ currentSlideId: null, status: 'setup' }));
  }
}

/* Löscht eine komplette Sitzung inklusive aller Zugangscodes, Fragen,
   Stimmen und Teilnahme-Markierungen. onProgress(text) ist optional und
   wird für eine Fortschrittsanzeige in der Oberfläche genutzt. */
async function deleteSessionDeep(sessionNumber, onProgress){
  const sessionRef = db.collection('sessions').doc(sessionNumber);
  onProgress && onProgress('Lösche Zugangscodes …');
  await deleteCollectionDocs(sessionRef.collection('tokens'));
  onProgress && onProgress('Lösche Fragen und Stimmen …');
  const slidesSnap = await withRetry(() => sessionRef.collection('slides').get());
  for(const slideDoc of slidesSnap.docs){
    const slideRef = slideDoc.ref;
    await deleteCollectionDocs(slideRef.collection('votes'));
    await deleteCollectionDocs(slideRef.collection('voters'));
    await withRetry(() => slideRef.delete());
  }
  onProgress && onProgress('Lösche Sitzung …');
  await withRetry(() => sessionRef.delete());
}

/* Initial render (falls Auth-Callback noch nicht gefeuert hat) */
render();
</script>
