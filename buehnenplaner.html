<!DOCTYPE html>
<html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bühnenplaner – GymWenTechnik</title>
<style>
:root{--bg:#15161b;--p:#1e2027;--p2:#262932;--ln:#343846;--tx:#e8e8ee;--mu:#9a9cab;--ac:#1EAE95;--li:#C4F135;--bad:#ff6b6b}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:13px system-ui,sans-serif;background:var(--bg);color:var(--tx);display:grid;grid-template:44px 1fr 26px/250px 1fr 290px;grid-template-areas:"t t t" "l m r" "s s s";overflow:hidden}
#top{grid-area:t;background:var(--p);border-bottom:1px solid var(--ln);display:flex;gap:4px;align-items:center;padding:0 8px;overflow-x:auto;white-space:nowrap}
#left{grid-area:l}#right{grid-area:r}#left,#right{background:var(--p);overflow:auto;padding:8px;border:0 solid var(--ln)}#left{border-right-width:1px}#right{border-left-width:1px}
#stage{grid-area:m;position:relative;background:#9fa3b0;overflow:hidden}#cv{width:100%;height:100%;display:block;touch-action:none}
#status{grid-area:s;background:var(--p);border-top:1px solid var(--ln);display:flex;gap:18px;align-items:center;padding:0 10px;color:var(--mu);font-size:12px;overflow:hidden;white-space:nowrap}
button,select,input{font:inherit;color:var(--tx);background:var(--p2);border:1px solid var(--ln);border-radius:6px;padding:4px 8px}
button{cursor:pointer}button:hover{border-color:var(--ac)}button.on{background:var(--ac);color:#04110e;border-color:var(--ac)}
input[type=color]{padding:0;height:26px;width:40px}input[type=checkbox]{width:auto}
.sep{width:1px;height:24px;background:var(--ln);margin:0 4px}
h4{margin:12px 0 6px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mu)}
.tabs{display:flex;gap:4px;margin-bottom:8px}.tabs button{flex:1}
.item{display:flex;align-items:center;gap:6px;padding:5px 6px;border:1px solid var(--ln);border-radius:6px;margin-bottom:4px;background:var(--p2);cursor:grab}
.item .sw{width:14px;height:14px;border-radius:3px;flex:none}.item b{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis}.item small{color:var(--mu)}
.item button{padding:0 6px}.row{display:grid;grid-template-columns:90px 1fr;gap:6px;align-items:center;margin-bottom:5px}.row input,.row select{width:100%}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{border-bottom:1px solid var(--ln);padding:3px 4px;text-align:left}th{color:var(--mu);font-weight:500}
.bad{color:var(--bad)}.ok{color:var(--li)}.ports td input,.ports td select{width:100%;padding:2px 3px}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#222;border:1px solid var(--ln);padding:8px 14px;border-radius:8px;display:none;z-index:5;max-width:80%}
#printArea{display:none}body.ro .ed{display:none}
#gate{position:absolute;inset:0;background:rgba(21,22,27,.95);z-index:9;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
@media print{body>*{display:none!important}#printArea{display:block!important}#printArea svg{max-width:100%;height:auto}}
@media(max-width:900px){body{grid-template-columns:200px 1fr 230px}}
</style></head><body>
<header id="top">
 <select id="projSel" title="Projekt wählen"></select>
 <button class="ed" data-a="pNew" title="Neues Projekt">Neu</button><button class="ed" data-a="pRen" title="Projekt umbenennen">Umbenennen</button><button class="ed" data-a="pDup" title="Projekt duplizieren">Duplizieren</button><button class="ed" data-a="pDel" title="Projekt löschen">Löschen</button>
 <span class="sep"></span>
 <button class="ed" data-a="open" title="Projektdatei (.json) importieren">Öffnen</button><button data-a="save" title="Projektdatei (.json) speichern (Strg+S)">Speichern</button>
 <select id="exp" title="Export"><option value="">Export…</option><option value="svg">Plan als SVG</option><option value="png">Plan als PNG</option><option value="csv">Materialliste (CSV)</option><option value="A4">Drucken A4</option><option value="A3">Drucken A3</option></select>
 <span class="sep"></span>
 <button class="ed" data-a="undo" title="Rückgängig (Strg+Z)">↶</button><button class="ed" data-a="redo" title="Wiederholen (Strg+Y)">↷</button>
 <span class="sep"></span>
 <button data-a="tSel" id="bSel" title="Auswahl (V)">Auswahl</button><button class="ed" data-a="tCab" id="bCab" title="Kabel verlegen (K)">Kabel</button>
 <span class="sep"></span>
 <button data-a="zo" title="Verkleinern (−)">−</button><button data-a="fit" title="Plan einpassen">Einpassen</button><button data-a="zi" title="Vergrößern (+)">+</button>
 <span class="sep"></span>
 <button data-a="tGrid" id="bGrid" title="Raster (G)">Raster</button><button class="ed" data-a="tSnap" id="bSnap" title="Einrasten an Raster und Kanten">Einrasten</button><button class="ed" data-a="tOrtho" id="bOrtho" title="Kabel rechtwinklig führen">90°</button>
 <input type="file" id="file" accept=".json,application/json" hidden>
</header>
<aside id="left"></aside>
<main id="stage"><svg id="cv"></svg><div id="toast"></div><div id="gate"><div>Verbinde mit dem Team-Server…</div></div></main>
<aside id="right"></aside>
<footer id="status"></footer>
<div id="printArea"></div>
<script>
'use strict';
/* ================= DATEN (Projektmodell) =================
 Alle Maße in Metern. Ein Kabel ist ein eigenes Objekt mit Typ, verfügbarer Länge, Reserve und Zwischenpunkten. */
const $=s=>document.querySelector(s),uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const PT=['Strom','DMX','XLR','LAN','Lautsprecher','Steuer'];
const PC={Strom:'#e74c3c',DMX:'#f1c40f',XLR:'#2ecc71',LAN:'#3498db',Lautsprecher:'#9b59b6',Steuer:'#e67e22'};
/* Gemeinsame Bibliothek (Objektvorlagen + Kabeltypen): liegt zentral in Firestore und gilt für ALLE Pläne. Es gibt keine Beispieldaten. */
const LIB={tpls:[],ctypes:[]};
const CLOUD={};let RO=true,SYNC='',PROJ=[],saveTimer=null;
const newProj=name=>({v:1,id:null,name,N:50,room:{w:12,h:8},grid:.5,snap:true,ortho:true,limit:3680,objs:[],cables:[],tpls:LIB.tpls,ctypes:LIB.ctypes});
let S,V={z:1,px:30,py:30},sel=new Set(),selC=null,tool='sel',draft=null,mouse={x:0,y:0},D=null,hist=[],fut=[],cur='',clip=[],rtab='prop',ltab='obj',q='',showGrid=true,curCt=null;

/* ================= GEOMETRIE ================= */
const ppm=()=>3779.5275/S.N*V.z;              /* CSS-Pixel pro Meter: 1 m = 1000 mm / N auf dem Papier */
const snapV=v=>{v=S.snap&&S.grid>0?Math.round(v/S.grid)*S.grid:v;return Math.round(v*1e4)/1e4};
const objById=id=>S.objs.find(o=>o.id===id);
function pw(o,p){const a=(o.rot||0)*Math.PI/180,dx=p.x-o.w/2,dy=p.y-o.h/2;return{x:o.x+o.w/2+dx*Math.cos(a)-dy*Math.sin(a),y:o.y+o.h/2+dx*Math.sin(a)+dy*Math.cos(a)}}
function endPt(e){const o=objById(e.o),p=o&&o.ports.find(x=>x.id===e.p);return p?pw(o,p):null}
const route=c=>[endPt(c.from),...c.pts,endPt(c.to)].filter(Boolean);
const plen=pts=>pts.reduce((s,p,i)=>i?s+Math.hypot(p.x-pts[i-1].x,p.y-pts[i-1].y):0,0);
const used=c=>plen(route(c))+(+c.res||0);
const broken=c=>!endPt(c.from)||!endPt(c.to);
const zoneAt=p=>{const z=S.objs.filter(o=>o.zone&&p.x>=o.x&&p.x<=o.x+o.w&&p.y>=o.y&&p.y<=o.y+o.h);return z.length?z[z.length-1].name:'–'};
const ortho=(a,p)=>Math.abs(p.x-a.x)>=Math.abs(p.y-a.y)?{x:p.x,y:a.y}:{x:a.x,y:p.y};
function toast(m,bad){const t=$('#toast');t.textContent=m;t.style.display='block';t.style.borderColor=bad?'var(--bad)':'var(--ac)';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',3500)}

/* ================= SPEICHERN / VERLAUF ================= */
const setSync=t=>{SYNC=t;status()};
function scheduleSave(){if(RO||!CLOUD.save||!S.id)return;clearTimeout(saveTimer);setSync('Speichert…');saveTimer=setTimeout(async()=>{saveTimer=null;await CLOUD.save()},700)}
function commit(){if(RO){renderAll();return}hist.push(cur);if(hist.length>100)hist.shift();cur=JSON.stringify(S);fut=[];scheduleSave();renderAll()}
function adopt(){LIB.tpls=S.tpls;LIB.ctypes=S.ctypes}
function load(p,keep){S=p;if(!keep){hist=[];fut=[];sel=new Set();selC=null;curCt=null;draft=null}cur=JSON.stringify(S);renderAll();if(!keep)fit()}
function undo(){if(RO||!hist.length)return;fut.push(cur);cur=hist.pop();S=JSON.parse(cur);adopt();sel=new Set();selC=null;scheduleSave();renderAll()}
function redo(){if(RO||!fut.length)return;hist.push(cur);cur=fut.pop();S=JSON.parse(cur);adopt();scheduleSave();renderAll()}
const RO_OK=new Set(['save','zo','zi','fit','tGrid','lt','rt','csv','tSel']);

/* ================= OBJEKTE ================= */
function addObj(tid,x,y){const t=S.tpls.find(k=>k.id===tid);if(!t||RO)return;
 const o={id:uid(),tpl:t.id,cat:t.cat,name:t.name,x:snapV(x-t.w/2),y:snapV(y-t.h/2),w:t.w,h:t.h,rot:0,color:t.color,watt:t.watt||0,kg:t.kg||0,circ:'',lock:false,zone:!!t.zone,dmx:{u:0,a:0,ch:t.ch||0},ports:t.ports.map(p=>({id:uid(),n:p.n,t:p.t,x:p.x,y:p.y}))};
 S.objs.push(o);sel=new Set([o.id]);selC=null;commit();return o}
function delObjs(ids){let n=0;S.cables=S.cables.filter(c=>{const hit=ids.has(c.from.o)||ids.has(c.to.o);if(hit)n++;return!hit});
 S.objs=S.objs.filter(o=>!ids.has(o.id));sel=new Set();commit();if(n)toast(n+' angeschlossene(s) Kabel wurde(n) mit entfernt.')}
function dupObjs(ids,off){const ns=new Set();ids.forEach(id=>{const o=objById(id);if(!o)return;const c=JSON.parse(JSON.stringify(o));c.id=uid();c.x+=off;c.y+=off;c.ports.forEach(p=>p.id=uid());S.objs.push(c);ns.add(c.id)});sel=ns;commit()}
const center=()=>{const r=$('#cv').getBoundingClientRect();return{x:(r.width/2-V.px)/ppm(),y:(r.height/2-V.py)/ppm()}};

/* ================= KABEL ================= */
function addCable(ct,from,to,pts){const nr='K'+(S.cables.reduce((m,c)=>Math.max(m,parseInt(c.nr.slice(1))||0),0)+1);
 const c={id:uid(),nr,name:ct.name,ct:ct.id,t:ct.t,len:ct.len,color:ct.color,res:0,from,to,pts:pts||[]};S.cables.push(c);selC=c.id;sel=new Set();commit();return c}
function portAt(el){const pe=el.closest&&el.closest('[data-p]');if(!pe)return null;const o=objById(pe.dataset.o);return o?{o:o.id,p:pe.dataset.p,port:o.ports.find(p=>p.id===pe.dataset.p),obj:o}:null}
function cableClick(e,w){const ct=S.ctypes.find(c=>c.id===curCt);if(!ct){toast('Wähle zuerst links einen Kabeltyp.',1);return}
 const pt=portAt(e.target);
 const check=a=>{if(a.port.t!==ct.t){toast('Nicht kompatibel: '+ct.name+' ('+ct.t+') passt nicht an „'+a.port.n+'“ ('+a.port.t+').',1);return false}
  if(S.cables.some(c=>(c.from.p===a.p)||(c.to.p===a.p))){toast('Der Anschluss „'+a.port.n+'“ ist bereits belegt.',1);return false}return true};
 if(!draft){if(!pt){toast('Starte das Kabel an einem Anschluss (farbiger Punkt).',1);return}if(!check(pt))return;draft={ct,from:{o:pt.o,p:pt.p},pts:[]};return}
 if(pt){if(pt.p===draft.from.p){toast('Start und Ziel sind derselbe Anschluss.',1);return}if(!check(pt))return;
  const c=addCable(draft.ct,draft.from,{o:pt.o,p:pt.p},draft.pts);draft=null;
  const u=used(c);toast(u>c.len?'Achtung: verlegt '+u.toFixed(2)+' m, verfügbar nur '+c.len+' m.':'Kabel verlegt: '+u.toFixed(2)+' m von '+c.len+' m.',u>c.len);return}
 const last=draft.pts.length?draft.pts[draft.pts.length-1]:endPt(draft.from);
 draft.pts.push(S.ortho?ortho(last,{x:snapV(w.x),y:snapV(w.y)}):{x:snapV(w.x),y:snapV(w.y)})}

/* ================= DARSTELLUNG ================= */
function content(pp,ui){const lw=n=>(n/pp).toFixed(4),fs=12/pp;let h='';const R=S.room;
 h+='<rect width="'+R.w+'" height="'+R.h+'" fill="#fff" stroke="#222" stroke-width="'+lw(2)+'"/>';
 if(S.grid>0&&S.grid*pp>5&&(showGrid||!ui))h+='<defs><pattern id="gp" width="'+S.grid+'" height="'+S.grid+'" patternUnits="userSpaceOnUse"><path d="M'+S.grid+' 0H0V'+S.grid+'" fill="none" stroke="#d3d4dc" stroke-width="'+lw(1)+'"/></pattern></defs><rect width="'+R.w+'" height="'+R.h+'" fill="url(#gp)"/>';
 h+='<text x="'+R.w/2+'" y="'+(-fs*.5)+'" font-size="'+fs+'" text-anchor="middle" fill="#333">'+R.w+' m</text><text transform="translate('+(-fs*.5)+' '+R.h/2+') rotate(-90)" font-size="'+fs+'" text-anchor="middle" fill="#333">'+R.h+' m</text>';
 const draw=o=>{const s=ui&&sel.has(o.id);
  h+='<g data-o="'+o.id+'" transform="translate('+o.x+' '+o.y+') rotate('+(o.rot||0)+' '+o.w/2+' '+o.h/2+')"><rect width="'+o.w+'" height="'+o.h+'" fill="'+esc(o.color)+'" fill-opacity="'+(o.zone?.18:.85)+'" stroke="'+(s?'#0a84ff':'#222')+'" stroke-width="'+lw(s?3:1.2)+'"'+(o.zone?' stroke-dasharray="'+lw(6)+' '+lw(4)+'"':'')+'/>'
  +'<text x="'+(o.zone?fs*.4:o.w/2)+'" y="'+(o.zone?fs*1.3:o.h/2)+'" font-size="'+fs+'" text-anchor="'+(o.zone?'start':'middle')+'" dominant-baseline="'+(o.zone?'auto':'middle')+'" fill="#111">'+esc(o.name)+(o.lock?' 🔒':'')+'</text>'
  +'<text x="'+o.w/2+'" y="'+(o.h+fs*1.1)+'" font-size="'+fs*.8+'" text-anchor="middle" fill="#444">'+o.w+'×'+o.h+' m</text>';
  o.ports.forEach(p=>{h+='<circle data-p="'+p.id+'" data-o="'+o.id+'" cx="'+p.x+'" cy="'+p.y+'" r="'+lw(5)+'" fill="'+(PC[p.t]||'#999')+'" stroke="#000" stroke-width="'+lw(1)+'"><title>'+esc(p.n)+' ('+esc(p.t)+')</title></circle>'+(ui?'<circle data-p="'+p.id+'" data-o="'+o.id+'" cx="'+p.x+'" cy="'+p.y+'" r="'+lw(10)+'" fill="transparent"/>':'')});
  h+='</g>'};
 S.objs.filter(o=>o.zone).forEach(draw);S.objs.filter(o=>!o.zone).forEach(draw);
 S.cables.forEach(c=>{const pts=route(c);if(pts.length<2)return;const u=used(c),bad=u>c.len+1e-9,s=ui&&selC===c.id,P=pts.map(p=>p.x+','+p.y).join(' ');
  if(s)h+='<polyline points="'+P+'" fill="none" stroke="#0a84ff" stroke-opacity=".45" stroke-width="'+lw(9)+'"/>';
  h+='<polyline data-c="'+c.id+'" points="'+P+'" fill="none" stroke="'+esc(c.color)+'" stroke-width="'+lw(3)+'" stroke-linejoin="round"'+(bad?' stroke-dasharray="'+lw(8)+' '+lw(4)+'"':'')+'/>';
  const m=pts[Math.floor(pts.length/2)],a=pts[Math.floor((pts.length-1)/2)],mx=(m.x+a.x)/2,my=(m.y+a.y)/2;
  h+='<text x="'+mx+'" y="'+(my-fs*.4)+'" font-size="'+fs*.85+'" text-anchor="middle" fill="'+(bad?'#d00':'#111')+'" stroke="#fff" stroke-width="'+lw(3)+'" paint-order="stroke">'+esc(c.nr)+' · '+u.toFixed(1)+'/'+c.len+' m</text>';
  if(s)c.pts.forEach((p,i)=>{h+='<circle data-w="'+c.id+'" data-i="'+i+'" cx="'+p.x+'" cy="'+p.y+'" r="'+lw(6)+'" fill="#fff" stroke="#0a84ff" stroke-width="'+lw(2)+'"/>'})});
 if(ui&&draft){const pts=[endPt(draft.from),...draft.pts].filter(Boolean),m=S.ortho?ortho(pts[pts.length-1],mouse):mouse;pts.push(m);
  h+='<polyline points="'+pts.map(p=>p.x+','+p.y).join(' ')+'" fill="none" stroke="'+esc(draft.ct.color)+'" stroke-width="'+lw(3)+'" stroke-dasharray="'+lw(6)+' '+lw(4)+'"/><text x="'+m.x+'" y="'+(m.y-fs)+'" font-size="'+fs+'" fill="#111">'+plen(pts).toFixed(2)+' m / '+draft.ct.len+' m</text>'}
 return h}
function render(){const cv=$('#cv'),pp=ppm(),r=cv.getBoundingClientRect();
 let h='<g transform="translate('+V.px+' '+V.py+') scale('+pp+')">'+content(pp,true)+'</g>';
 const bar=pp,y=r.height-34;h+='<g font-size="11" fill="#111"><rect x="12" y="'+(y-14)+'" width="'+(bar+16)+'" height="34" fill="#fff" fill-opacity=".85" rx="4"/><path d="M20 '+y+'h'+bar+'M20 '+(y-4)+'v8M'+(20+bar)+' '+(y-4)+'v8" stroke="#111" stroke-width="2"/><text x="20" y="'+(y+14)+'">1 m  (1:'+S.N+')</text></g>';
 cv.innerHTML=h;status()}
function status(){const w=mouse,o=sel.size===1?objById([...sel][0]):null,c=S.cables.find(k=>k.id===selC),over=S.cables.filter(k=>used(k)>k.len+1e-9).length;
 $('#status').innerHTML='<span>Maßstab 1:'+S.N+' · Zoom '+Math.round(V.z*100)+'%</span><span>Maus: '+w.x.toFixed(2)+' m / '+w.y.toFixed(2)+' m</span><span>'+(o?esc(o.name)+' @ '+o.x.toFixed(2)+' / '+o.y.toFixed(2)+' m':c?'Kabel '+esc(c.nr)+': '+used(c).toFixed(2)+' m':sel.size?sel.size+' Objekte':'Nichts ausgewählt')+'</span><span>'+S.objs.length+' Objekte · '+S.cables.length+' Kabel</span>'+(over?'<span class="bad">'+over+' Kabel zu kurz</span>':'')+'<span style="margin-left:auto">'+(RO?'Nur Ansicht – Bearbeiten nur für Admin und verwaltende Mitglieder':SYNC)+'</span>'}
function fit(){const r=$('#cv').getBoundingClientRect();V.z=Math.min((r.width-80)/(S.room.w*3779.5/S.N),(r.height-80)/(S.room.h*3779.5/S.N));V.px=(r.width-S.room.w*ppm())/2;V.py=(r.height-S.room.h*ppm())/2;render()}

/* ================= SEITENLEISTEN ================= */
function renderLeft(){let h='<div class="tabs"><button data-a="lt" data-v="obj" class="'+(ltab==='obj'?'on':'')+'">Objekte</button><button data-a="lt" data-v="cab" class="'+(ltab==='cab'?'on':'')+'">Kabel</button></div>';
 if(ltab==='obj'){h+='<input id="q" placeholder="Suchen…" value="'+esc(q)+'" style="width:100%;margin-bottom:6px">'+(RO?'':'<button data-a="tplNew" style="width:100%;margin-bottom:6px">＋ Neue Vorlage</button>');
  if(!S.tpls.length)h+='<p style="color:var(--mu)">'+(RO?'Noch keine Objekte in der Bibliothek.':'Noch keine Objekte. Lege mit „＋ Neue Vorlage“ das erste an (Geräte, Podeste oder Bereiche wie Bühne/FOH).')+'</p>';
  const cats=[...new Set(S.tpls.map(t=>t.cat||'Ohne Kategorie'))];cats.forEach(c=>{const l=S.tpls.filter(t=>(t.cat||'Ohne Kategorie')===c&&(!q||(t.name+c).toLowerCase().includes(q.toLowerCase())));if(!l.length)return;
   h+='<h4>'+esc(c)+'</h4>'+l.map(t=>'<div class="item"'+(RO?'':' draggable="true" data-tpl="'+t.id+'" title="Klicken zum Platzieren oder auf die Fläche ziehen"')+'><span class="sw" style="background:'+esc(t.color)+'"></span><b>'+esc(t.name)+'</b><small>'+t.w+'×'+t.h+'</small>'+(RO?'':'<button data-a="tplDup" data-id="'+t.id+'" title="Vorlage duplizieren">⧉</button><button data-a="tplDel" data-id="'+t.id+'" title="Vorlage löschen">✕</button>')+'</div>').join('')});
  if(!RO&&S.tpls.length)h+='<p style="color:var(--mu)">Vorlage ändern: Objekt platzieren, im Eigenschaftenfenster bearbeiten und „Als Vorlage speichern“.</p>'}
 else{h+=RO?'':'<button data-a="ctNew" style="width:100%;margin-bottom:6px">＋ Neuer Kabeltyp</button>';
  if(!S.ctypes.length)h+='<p style="color:var(--mu)">'+(RO?'Noch keine Kabeltypen.':'Noch keine Kabeltypen. Lege mit „＋ Neuer Kabeltyp“ den ersten an.')+'</p>';
  h+=S.ctypes.map(c=>'<div class="item" style="cursor:'+(RO?'default':'pointer')+';'+(curCt===c.id?'border-color:var(--li)':'')+'"'+(RO?'':' data-ct="'+c.id+'" title="Klicken, um das Kabel-Werkzeug mit diesem Typ zu starten"')+'><span class="sw" style="background:'+esc(c.color)+'"></span><b>'+esc(c.name)+'</b><small>'+c.t+' · '+c.len+' m</small></div>').join('');

$('#exp').addEventListener('change',e=>{const v=e.target.value;e.target.value='';if(v==='svg')dl(fn('svg'),planSVG(),'image/svg+xml');else if(v==='png')exportPng();else if(v==='csv')exportCsv();else if(v)printPlan(v)});
$('#file').addEventListener('change',e=>{const f=e.target.files[0];if(!f||RO)return;const r=new FileReader();r.onload=async()=>{try{const p=JSON.parse(r.result);if(!p||p.v!==1||!Array.isArray(p.objs)||!Array.isArray(p.cables))throw 0;await CLOUD.importProject(p);toast('Plan importiert.')}catch(x){toast('Das ist keine gültige Planer-Projektdatei.',1)}};r.readAsText(f);e.target.value=''});
$('#right').addEventListener('change',e=>{if(RO)return;const t=e.target,k=t.dataset.k;if(!k)return;let v=t.type==='checkbox'?t.checked:t.type==='number'?(parseFloat(t.value)||0):t.value,s=t.dataset.s,tg;
 if(s==='o')tg=objById(t.dataset.id);else if(s==='dmx')tg=objById(t.dataset.id).dmx;else if(s==='p')tg=objById(t.dataset.id).ports.find(p=>p.id===t.dataset.pid);else if(s==='c')tg=S.cables.find(c=>c.id===t.dataset.id);
 if(s==='proj'){if(k==='N')S.N=+v;else if(k==='rw')S.room.w=Math.max(1,v);else if(k==='rh')S.room.h=Math.max(1,v);else S[k]=v}else if(tg){if((k==='w'||k==='h')&&v<.01)v=.01;tg[k]=v}
 commit()});
$('#left').addEventListener('change',e=>{if(RO)return;const t=e.target;if(t.dataset.s!=='ct')return;const c=S.ctypes.find(k=>k.id===t.dataset.id);c[t.dataset.k]=t.type==='number'?(parseFloat(t.value)||0):t.value;
 S.cables.forEach(k=>{if(k.ct===c.id&&['color'].includes(t.dataset.k))k.color=c.color});commit()});
document.addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;const k=e.key.toLowerCase(),m=e.ctrlKey||e.metaKey;if(RO&&!(k==='g'||k==='+'||k==='='||k==='-'||k==='escape'||k==='v'||(m&&k==='s')))return;
 if(m&&k==='z'){e.preventDefault();e.shiftKey?redo():undo()}else if(m&&k==='y'){e.preventDefault();redo()}
 else if(m&&k==='s'){e.preventDefault();dl(fn('json'),JSON.stringify(S,null,1),'application/json')}
 else if(m&&k==='c'){clip=[...sel].map(i=>JSON.parse(JSON.stringify(objById(i))))}
 else if(m&&k==='x'){clip=[...sel].map(i=>JSON.parse(JSON.stringify(objById(i))));delObjs(new Set(sel))}
 else if(m&&k==='v'&&clip.length){const ns=new Set();clip.forEach(o=>{const c=JSON.parse(JSON.stringify(o));c.id=uid();c.x+=.5;c.y+=.5;c.ports.forEach(p=>p.id=uid());S.objs.push(c);ns.add(c.id)});sel=ns;commit()}
 else if(m&&k==='d'){e.preventDefault();dupObjs(sel,.5)}
 else if(k==='delete'||k==='backspace'){if(sel.size)delObjs(new Set(sel));else if(selC){S.cables=S.cables.filter(c=>c.id!==selC);selC=null;commit()}}
 else if(k==='escape'){draft=null;tool='sel';renderAll()}
 else if(!m&&k==='v'){tool='sel';draft=null;renderAll()}
 else if(!m&&k==='k'){tool='cab';if(!curCt)curCt=S.ctypes[0]&&S.ctypes[0].id;ltab='cab';renderAll()}
 else if(!m&&k==='r'){sel.forEach(i=>{const o=objById(i);o.rot=((o.rot||0)+90)%360});if(sel.size)commit()}
 else if(!m&&k==='g'){showGrid=!showGrid;renderAll()}
 else if(k==='+'||k==='=')zoom(1.25);else if(k==='-')zoom(1/1.25);
 else if(k.startsWith('arrow')&&sel.size){e.preventDefault();const st=e.shiftKey?1:(S.grid||.1),d={arrowleft:[-st,0],arrowright:[st,0],arrowup:[0,-st],arrowdown:[0,st]}[k];sel.forEach(i=>{const o=objById(i);if(!o.lock){o.x=Math.round((o.x+d[0])*1e4)/1e4;o.y=Math.round((o.y+d[1])*1e4)/1e4}});commit()}});
window.addEventListener('resize',render);
window.PL={get RO(){return RO},LIB,get S(){return S},addObj,addCable,route,used,plen,planSVG,matList,undo,redo,load,newProj,get hist(){return hist.length}};

/* ================= START ================= */
S=newProj('Kein Plan');cur=JSON.stringify(S);renderAll();fit();
</script><script type="module">
/* ================= ZENTRALE SPEICHERUNG (Firestore) =================
 planner_projects/{id}: ein Plan (name, data = JSON-Text), planner_library/main: gemeinsame Vorlagen + Kabeltypen.
 Lesen: alle freigeschalteten Mitglieder. Schreiben: nur Admin / verwaltendes Mitglied (erzwingen die Firestore-Regeln). */
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import{getAuth,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";
import{getFirestore,doc,getDoc,getDocs,setDoc,deleteDoc,collection,onSnapshot,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";
const app=initializeApp({apiKey:"AIzaSyDQpvKRIGh55OHYeqtcZ7Hzz4qcie_KAXU",authDomain:"gwt-database.firebaseapp.com",projectId:"gwt-database",storageBucket:"gwt-database.firebasestorage.app",messagingSenderId:"410076918223",appId:"1:410076918223:web:3c7bb9a2084fdc83b9a2ba"});
const auth=getAuth(app),db=getFirestore(app),gateEl=document.getElementById('gate');
let me=null,unsubP=null,unsubL=null,libSig='';
const gate=(m,link)=>{gateEl.style.display='flex';gateEl.innerHTML='<div>'+m+'</div>'+(link?'<a href="https://gymwentechnik.de/gwtorgatool.html" target="_top" style="color:var(--li)">Zum gwtOrgatool (Anmeldung)</a>':'')};
const sig=()=>JSON.stringify([LIB.tpls,LIB.ctypes]);
function applyLib(d){LIB.tpls=d&&d.tpls?JSON.parse(d.tpls):[];LIB.ctypes=d&&d.ctypes?JSON.parse(d.ctypes):[];libSig=sig();S.tpls=LIB.tpls;S.ctypes=LIB.ctypes;renderLeft();renderRight()}
async function refreshList(){const s=await getDocs(collection(db,'planner_projects'));PROJ=s.docs.map(d=>({id:d.id,name:d.data().name||'Plan'})).sort((a,b)=>a.name.localeCompare(b.name,'de'))}
function loadRemote(snap,keep){const d=snap.data();let p;try{p=JSON.parse(d.data)}catch(e){toast('Dieser Plan ist beschädigt.',1);return}
 p.id=snap.id;p.name=d.name||p.name;p.tpls=LIB.tpls;p.ctypes=LIB.ctypes;load(p,keep);if(keep)sel=new Set([...sel].filter(i=>objById(i)))}
async function openProject(id){
 if(unsubP){unsubP();unsubP=null}
 const snap=await getDoc(doc(db,'planner_projects',id));
 if(!snap.exists()){toast('Dieser Plan existiert nicht mehr.',1);await refreshList();renderAll();return}
 loadRemote(snap,false);try{localStorage.setItem('gwt_planer_last',id)}catch(e){}
 unsubP=onSnapshot(doc(db,'planner_projects',id),s=>{if(!s.exists()||s.metadata.hasPendingWrites)return;const d=s.data();if(d.updatedBy===me)return;if(!RO&&saveTimer)return;loadRemote(s,true);setSync('Von einem Teammitglied aktualisiert')})}
async function createProject(p){p.id=Math.random().toString(36).slice(2,9);const{tpls,ctypes,...proj}=p;
 await setDoc(doc(db,'planner_projects',p.id),{name:p.name,data:JSON.stringify(proj),updatedAt:serverTimestamp(),updatedBy:me});
 await refreshList();await openProject(p.id)}
CLOUD.open=openProject;
CLOUD.newProject=async()=>{const n=prompt('Name des neuen Plans:','Neuer Plan');if(n)await createProject(newProj(n))};
CLOUD.dup=async()=>{const c=JSON.parse(JSON.stringify(S));c.name=S.name+' (Kopie)';await createProject(c)};
CLOUD.importProject=async p=>{p.name=p.name||'Import';await createProject(p)};
CLOUD.del=async()=>{if(!confirm('Plan „'+S.name+'“ für ALLE löschen? Das kann nicht rückgängig gemacht werden.'))return;
 await deleteDoc(doc(db,'planner_projects',S.id));await refreshList();if(PROJ.length)await openProject(PROJ[0].id);else await createProject(newProj('Plan 1'))};
CLOUD.save=async()=>{if(RO||!S.id||!me)return;
 try{const{tpls,ctypes,...proj}=S,data=JSON.stringify(proj);if(data.length>900000)throw new Error('Der Plan ist zu groß für die Datenbank.');
  await setDoc(doc(db,'planner_projects',S.id),{name:S.name,data,updatedAt:serverTimestamp(),updatedBy:me});
  if(sig()!==libSig){await setDoc(doc(db,'planner_library','main'),{tpls:JSON.stringify(S.tpls),ctypes:JSON.stringify(S.ctypes),updatedAt:serverTimestamp(),updatedBy:me});LIB.tpls=S.tpls;LIB.ctypes=S.ctypes;libSig=sig()}
  const e=PROJ.find(x=>x.id===S.id);if(e&&e.name!==S.name){e.name=S.name;renderAll()}
  setSync('Gespeichert ✓')}catch(e){console.error(e);setSync('Speichern fehlgeschlagen');toast('Speichern fehlgeschlagen: '+(e.code==='permission-denied'?'keine Berechtigung (Firestore-Regeln veröffentlicht?).':e.message),1)}};
onAuthStateChanged(auth,async user=>{
 if(unsubP){unsubP();unsubP=null}if(unsubL){unsubL();unsubL=null}me=null;
 if(!user){RO=true;document.body.classList.add('ro');gate('Bitte zuerst im gwtOrgatool anmelden.',true);return}
 try{const us=await getDoc(doc(db,'users',user.uid)),role=us.exists()?us.data().role:null;
  if(!role||role==='pending'||role==='inactive'){RO=true;document.body.classList.add('ro');gate('Dein Konto ist noch nicht freigeschaltet.');return}
  me=user.uid;RO=!(role==='admin'||role==='verwaltendes');document.body.classList.toggle('ro',RO);
  await new Promise((res,rej)=>{let first=true;unsubL=onSnapshot(doc(db,'planner_library','main'),snap=>{if(snap.metadata.hasPendingWrites)return;const d=snap.exists()?snap.data():null;
   if(first){first=false;applyLib(d);res()}else if(RO||(d&&d.updatedBy!==me&&!saveTimer))applyLib(d)},rej)});
  await refreshList();
  const last=(()=>{try{return localStorage.getItem('gwt_planer_last')}catch(e){return null}})();
  if(PROJ.length)await openProject(PROJ.some(p=>p.id===last)?last:PROJ[0].id);
  else if(!RO)await createProject(newProj('Plan 1'));
  else{load(newProj('Noch kein Plan'));toast('Es gibt noch keine Pläne.')}
  gateEl.style.display='none';setSync(RO?'':'Verbunden')
 }catch(e){console.error(e);gate('Verbindung fehlgeschlagen oder keine Berechtigung. Sind die Firestore-Regeln veröffentlicht?')}});
</script>
