<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>gwtOrgatool – GymWenTechnik</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f4f5f7; --panel:#ffffff; --panel-sunken:#f0f1f4; --line:#e2e4e9; --line-strong:#cfd2da;
    --ink:#1a1c22; --ink-soft:#585d68; --ink-faint:#9498a3;
    --accent:#1EAE95; --accent-hover:#189b84; --accent-soft:#e3f6f2;
    --accent2:#B01C75; --accent2-soft:#fbe6f1;
    --warn:#f39c12; --warn-soft:#fdf1de;
    --danger:#d64545; --danger-soft:#fbe9e9;
    --success:#21860E; --success-soft:#e6f4e3;
    --r-sm:8px; --r-md:12px; --r-lg:16px;
    --shadow-sm:0 1px 2px rgba(20,20,30,0.05);
    --shadow-md:0 4px 16px rgba(20,20,30,0.08);
    --shadow-lg:0 12px 40px rgba(20,20,30,0.14);
    --sans:'Inter',-apple-system,sans-serif;
    --display:'Space Grotesk',sans-serif;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  html,body{height:100%;}
  body{
    background:var(--bg); color:var(--ink); font-family:var(--sans); font-size:14px; line-height:1.6;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ===== LOGIN ===== */
  #loginScreen{
    position:fixed; inset:0; z-index:500; background:
      radial-gradient(circle at 20% 20%, var(--accent-soft) 0%, transparent 45%),
      radial-gradient(circle at 80% 80%, var(--accent2-soft) 0%, transparent 45%),
      var(--bg);
    display:flex; align-items:center; justify-content:center; padding:20px;
  }
  #loginScreen.hidden{display:none;}
  .login-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--r-lg);
    box-shadow:var(--shadow-lg); padding:44px 40px; width:100%; max-width:380px;
  }
  .login-logo{display:flex;align-items:center;gap:10px;justify-content:center;margin-bottom:26px;}
  .login-logo .mark{width:30px;height:30px;border-radius:9px;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:none;}
  .login-logo span{font-family:var(--display);font-weight:700;font-size:19px;letter-spacing:-0.01em;}
  .login-logo .tag{font-size:10px;color:var(--ink-faint);font-weight:500;letter-spacing:0.08em;text-transform:uppercase;margin-left:2px;}
  .login-card h1{font-family:var(--display);font-size:20px;font-weight:600;margin:0 0 6px;text-align:center;}
  .login-card>p{font-size:13px;color:var(--ink-soft);margin:0 0 26px;text-align:center;line-height:1.6;}
  .login-field{display:flex;flex-direction:column;gap:5px;margin-bottom:15px;}
  .login-field label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.06em;color:var(--ink-faint);}
  .login-field input{
    border:1px solid var(--line); border-radius:var(--r-sm); padding:11px 13px; font-size:14px;
    background:var(--panel-sunken); color:var(--ink); transition:border-color .15s, background .15s;
  }
  .login-field input:focus{outline:none;border-color:var(--accent);background:var(--panel);}
  #loginErr{
    display:none; font-size:12.5px; color:var(--danger); background:var(--danger-soft);
    border-radius:var(--r-sm); padding:10px 12px; margin-bottom:15px; line-height:1.5;
  }
  #loginErr.info{color:var(--warn);background:var(--warn-soft);}
  #loginBtn{
    width:100%; padding:12px; border:none; border-radius:var(--r-sm); background:var(--accent);
    color:#fff; font-weight:600; font-size:14px; transition:background .15s; margin-top:6px;
  }
  #loginBtn:hover{background:var(--accent-hover);}
  #loginBtn:disabled{opacity:.5;cursor:default;}
  .login-footer{margin-top:20px;font-size:11.5px;color:var(--ink-faint);text-align:center;line-height:1.6;}
  .login-footer a{color:var(--accent);text-decoration:none;}

  /* ===== APP SHELL ===== */
  #app{display:none;height:100vh;grid-template-columns:240px 1fr;}
  #app.unlocked{display:grid;}

  /* SIDEBAR */
  .sidebar{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:hidden;}
  .sidebar-head{padding:20px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  .sidebar-head .mark{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--accent2));flex:none;}
  .sidebar-head span{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:-0.01em;}
  .sidebar-search{padding:12px 14px;}
  .sidebar-search input{
    width:100%;border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px 8px 30px;font-size:12.5px;
    background:var(--panel-sunken);color:var(--ink);
  }
  .sidebar-search-wrap{position:relative;}
  .sidebar-search-wrap::before{content:'⌕';position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-faint);font-size:13px;pointer-events:none;}
  .sidebar-search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:9.5px;color:var(--ink-faint);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;pointer-events:none;}
  .sidebar-nav{flex:1;overflow-y:auto;padding:6px 10px;}
  .nav-group{margin-bottom:4px;}
  .nav-group-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:0.08em;color:var(--ink-faint);padding:14px 10px 6px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:var(--r-sm);color:var(--ink-soft);
    text-decoration:none;font-size:13.5px;font-weight:500;cursor:pointer;transition:background .12s,color .12s;border:none;background:none;width:100%;text-align:left;
  }
  .nav-item:hover{background:var(--panel-sunken);color:var(--ink);}
  .nav-item.active{background:var(--accent-soft);color:var(--accent-hover);}
  .nav-item .ic{width:18px;text-align:center;flex:none;font-size:14px;}
  .nav-item .badge{margin-left:auto;background:var(--accent2);color:#fff;font-size:10px;font-weight:700;border-radius:100px;padding:1px 6px;min-width:16px;text-align:center;}
  .sidebar-foot{border-top:1px solid var(--line);padding:10px;}
  .user-card{display:flex;align-items:center;gap:10px;padding:8px;border-radius:var(--r-sm);cursor:pointer;transition:background .12s;position:relative;}
  .user-card:hover{background:var(--panel-sunken);}
  .user-avatar{width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent-hover);display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:13px;flex:none;overflow:hidden;}
  .user-avatar img{width:100%;height:100%;object-fit:cover;}
  .user-card-text{flex:1;min-width:0;}
  .user-card-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .user-card-role{font-size:10.5px;color:var(--ink-faint);}
  .user-menu{
    position:absolute;bottom:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);
    border-radius:var(--r-md);box-shadow:var(--shadow-lg);padding:6px;display:none;flex-direction:column;gap:1px;z-index:50;
  }
  .user-menu.open{display:flex;}
  .user-menu button{display:flex;align-items:center;gap:8px;padding:8px 10px;border:none;background:none;border-radius:var(--r-sm);font-size:12.5px;color:var(--ink-soft);text-align:left;}
  .user-menu button:hover{background:var(--panel-sunken);color:var(--ink);}
  .user-menu button.danger{color:var(--danger);}
  .user-menu button.danger:hover{background:var(--danger-soft);}

  /* MAIN */
  .main{overflow-y:auto;display:flex;flex-direction:column;}
  .topbar{
    background:var(--panel);border-bottom:1px solid var(--line);padding:16px 28px;
    display:flex;align-items:center;justify-content:space-between;gap:16px;position:sticky;top:0;z-index:10;
  }
  .topbar h1{font-family:var(--display);font-size:19px;font-weight:600;}
  .topbar-sub{font-size:12px;color:var(--ink-faint);margin-top:2px;}
  .content{padding:28px;flex:1;}

  .hamburger-btn{display:none;background:var(--panel-sunken);border:1px solid var(--line);border-radius:var(--r-sm);width:34px;height:34px;align-items:center;justify-content:center;font-size:15px;flex:none;}

  /* CARDS / WIDGETS */
  .grid{display:grid;gap:16px;}
  .grid-2{grid-template-columns:repeat(2,1fr);}
  .grid-3{grid-template-columns:repeat(3,1fr);}
  .grid-4{grid-template-columns:repeat(4,1fr);}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px;box-shadow:var(--shadow-sm);}
  .card-title{font-family:var(--display);font-size:14.5px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
  .card-title a{font-size:11.5px;color:var(--accent);text-decoration:none;font-weight:500;}
  .stat-card{padding:18px 20px;}
  .stat-num{font-family:var(--display);font-size:28px;font-weight:700;line-height:1;}
  .stat-label{font-size:12px;color:var(--ink-faint);margin-top:6px;}
  .stat-card.accent{background:linear-gradient(135deg,var(--accent-soft),var(--panel));}
  .stat-card.accent2{background:linear-gradient(135deg,var(--accent2-soft),var(--panel));}

  .list-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);}
  .list-row:last-child{border-bottom:none;}
  .list-row-dot{width:8px;height:8px;border-radius:50%;flex:none;}
  .list-row-dot.event{background:var(--accent);}
  .list-row-dot.buehne{background:var(--accent2);}
  .list-row-dot.probe{background:var(--warn);}
  .list-row-text{flex:1;min-width:0;}
  .list-row-title{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .list-row-meta{font-size:11.5px;color:var(--ink-faint);}
  .empty-hint{color:var(--ink-faint);font-size:12.5px;padding:18px 0;text-align:center;}

  .todo-row{display:flex;align-items:center;gap:10px;padding:8px 0;}
  .todo-check{width:18px;height:18px;border:1.5px solid var(--line-strong);border-radius:5px;flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:11px;color:#fff;transition:all .15s;}
  .todo-check.done{background:var(--accent);border-color:var(--accent);}
  .todo-text{flex:1;font-size:13px;}
  .todo-text.done{color:var(--ink-faint);text-decoration:line-through;}

  .skel{position:relative;overflow:hidden;background:var(--panel-sunken);border-radius:var(--r-sm);}
  .skel::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.7),transparent);background-size:300px 100%;animation:shimmer 1.4s infinite;}
  @keyframes shimmer{0%{background-position:-300px 0}100%{background-position:300px 0}}
  .skel-line{height:12px;margin-bottom:8px;}

  .placeholder-view{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:80px 20px;text-align:center;color:var(--ink-faint);}
  .placeholder-view .ic{font-size:40px;margin-bottom:14px;opacity:0.5;}
  .placeholder-view h2{font-family:var(--display);font-size:17px;color:var(--ink-soft);margin-bottom:6px;}
  .placeholder-view p{font-size:13px;max-width:340px;}

  .spinner{width:16px;height:16px;border-radius:50%;border:2px solid rgba(255,255,255,0.35);border-top-color:#fff;animation:spin .7s linear infinite;display:inline-block;vertical-align:middle;margin-right:6px;}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* MOBILE */
  /* ===== SHARED FORM COMPONENTS ===== */
  .form-grid-2{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:12px;}
  .form-grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:12px;}
  .field-group{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;}
  .field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:0.05em;color:var(--ink-faint);}
  .field-group input,.field-group select,.field-group textarea{
    border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 11px;font-size:13.5px;
    background:var(--panel-sunken);color:var(--ink);transition:border-color .15s,background .15s;width:100%;
  }
  .field-group input:focus,.field-group select:focus,.field-group textarea:focus{outline:none;border-color:var(--accent);background:var(--panel);}
  .btn-primary{background:var(--accent);color:#fff;border:none;border-radius:var(--r-sm);padding:10px 20px;font-size:13.5px;font-weight:600;transition:background .15s;}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-primary:disabled{opacity:.6;pointer-events:none;}
  .btn-secondary{background:var(--panel-sunken);color:var(--ink-soft);border:1px solid var(--line);border-radius:var(--r-sm);padding:10px 18px;font-size:13.5px;font-weight:500;transition:all .15s;}
  .btn-secondary:hover{background:var(--panel);border-color:var(--line-strong);color:var(--ink);}
  .filter-chip{background:var(--panel-sunken);border:1px solid var(--line);border-radius:100px;padding:6px 14px;font-size:12px;color:var(--ink-soft);margin-right:6px;margin-bottom:10px;transition:all .15s;}
  .filter-chip:hover{border-color:var(--line-strong);}
  .filter-chip.active{background:var(--accent);color:#fff;border-color:var(--accent);}
  .tag-badge{font-size:10px;letter-spacing:0.05em;text-transform:uppercase;padding:2px 8px;border-radius:100px;background:var(--panel-sunken);color:var(--ink-faint);margin-left:6px;font-weight:600;}
  .tag-badge.cat-event{background:var(--accent-soft);color:var(--accent-hover);}
  .tag-badge.cat-buehne{background:var(--accent2-soft);color:var(--accent2);}
  .tag-badge.cat-probe{background:var(--warn-soft);color:var(--warn);}

  /* ===== EVENTS ===== */
  .ev-row{display:flex;align-items:flex-start;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .ev-row:last-child{border-bottom:none;}
  .ev-row .list-row-dot{margin-top:5px;}
  .ev-row-actions{display:flex;gap:6px;flex:none;}
  .ev-row-actions button{background:var(--panel-sunken);border:1px solid var(--line);border-radius:var(--r-sm);padding:6px 12px;font-size:11.5px;color:var(--ink-soft);white-space:nowrap;}
  .ev-row-actions button:hover{background:var(--panel);color:var(--ink);}
  .ev-row-actions button.danger{color:var(--danger);}
  .ev-row-actions button.danger:hover{background:var(--danger-soft);}
  .shift-summary{font-size:11.5px;color:var(--ink-faint);margin-top:4px;}
  .shift-row{display:grid;grid-template-columns:1.4fr 0.7fr 0.7fr 1fr auto;gap:6px;margin-bottom:6px;}
  .shift-row input,.shift-row select{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;font-size:12.5px;background:var(--panel-sunken);color:var(--ink);}
  .shift-row button{background:none;border:1px solid var(--danger);color:var(--danger);border-radius:var(--r-sm);font-size:11px;padding:6px 8px;}
  .mat-picker{display:flex;flex-wrap:wrap;gap:8px;max-height:130px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:10px;background:var(--panel-sunken);}
  .mat-chip{display:flex;align-items:center;gap:6px;font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:100px;padding:5px 12px;}

  /* ===== TEAM-CHAT ===== */
  .chip-btn{background:var(--panel-sunken);border:1px solid var(--line);border-radius:100px;padding:5px 11px;font-size:11px;color:var(--ink-soft);transition:all .15s;}
  .chip-btn:hover{border-color:var(--accent);color:var(--accent);}
  .chat-shell{display:flex;border:1px solid var(--line);border-radius:var(--r-lg);background:var(--panel);height:calc(100vh - 170px);overflow:hidden;box-shadow:var(--shadow-sm);}
  .chat-sidebar{width:270px;border-right:1px solid var(--line);display:flex;flex-direction:column;flex:none;}
  .chat-sidebar-head{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);font-weight:600;font-size:13.5px;}
  .chat-conv-list{flex:1;overflow-y:auto;}
  .chat-conv-item{display:flex;align-items:center;gap:10px;padding:11px 16px;cursor:pointer;border-left:2px solid transparent;transition:background .12s;}
  .chat-conv-item:hover{background:var(--panel-sunken);}
  .chat-conv-item.active{background:var(--accent-soft);border-left-color:var(--accent);}
  .chat-conv-avatar{width:34px;height:34px;border-radius:50%;background:var(--panel-sunken);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--ink-faint);flex:none;overflow:hidden;}
  .chat-conv-avatar img{width:100%;height:100%;object-fit:cover;}
  .chat-conv-text{flex:1;min-width:0;}
  .chat-conv-name{font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .chat-conv-sub{font-size:10.5px;color:var(--ink-faint);}
  .chat-main{flex:1;display:flex;flex-direction:column;min-width:0;}
  .chat-main-head{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .chat-main-title{font-family:var(--display);font-weight:600;font-size:15px;}
  .chat-main-sub{font-size:11px;color:var(--ink-faint);}
  .chat-thread{flex:1;overflow-y:auto;padding:18px 20px;display:flex;flex-direction:column;gap:12px;}
  .chat-bubble{display:flex;gap:8px;align-items:flex-start;max-width:78%;}
  .chat-bubble.own{margin-left:auto;flex-direction:row-reverse;}
  .chat-bubble-avatar{width:28px;height:28px;border-radius:50%;background:var(--panel-sunken);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:var(--ink-faint);flex:none;overflow:hidden;}
  .chat-bubble-avatar img{width:100%;height:100%;object-fit:cover;}
  .chat-bubble-card{background:var(--panel-sunken);padding:9px 13px;border-radius:14px 14px 14px 4px;}
  .chat-bubble.own .chat-bubble-card{background:var(--accent-soft);border-radius:14px 14px 4px 14px;}
  .chat-bubble-name{font-size:11px;font-weight:600;color:var(--accent-hover);margin-bottom:2px;}
  .chat-bubble-text{font-size:13px;white-space:pre-wrap;}
  .chat-bubble-time{font-size:10px;color:var(--ink-faint);margin-top:3px;}
  .chat-bubble.own .chat-bubble-content{text-align:right;}
  .link-btn{background:none;border:none;color:var(--ink-faint);font-size:10px;padding:0;}
  .link-btn:hover{color:var(--danger);}
  .chat-input-row{display:flex;gap:10px;padding:14px 18px;border-top:1px solid var(--line);}
  .chat-input-row textarea{flex:1;border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;background:var(--panel-sunken);color:var(--ink);resize:none;min-height:40px;max-height:110px;font-family:var(--sans);}
  .chat-input-row textarea:focus{outline:none;border-color:var(--accent);}
  .chat-voice-embed{flex:1;background:#000;}
  .chat-voice-embed iframe{width:100%;height:100%;border:none;}

  /* ===== GENERIC MODAL ===== */
  .modal-overlay{display:none;position:fixed;inset:0;background:rgba(20,20,30,0.4);backdrop-filter:blur(3px);z-index:400;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--panel);border-radius:var(--r-lg);box-shadow:var(--shadow-lg);padding:26px;max-width:420px;width:100%;max-height:80vh;overflow-y:auto;}
  .modal-box h3{font-family:var(--display);font-size:16px;font-weight:600;margin-bottom:16px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}
  .modal-pick-list{max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r-sm);padding:6px;}
  .modal-pick-row{padding:9px 10px;font-size:13px;cursor:pointer;border-radius:var(--r-sm);}
  .modal-pick-row:hover{background:var(--panel-sunken);}
  .modal-check-row{display:flex;align-items:center;gap:8px;padding:7px 8px;font-size:12.5px;}
  .inv-status-select{border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 9px;font-size:12.5px;background:var(--panel-sunken);color:var(--ink);}

  @media (max-width:900px){
    #app.unlocked{display:block;}
    .sidebar{position:fixed;top:0;left:0;bottom:0;width:260px;z-index:200;transform:translateX(-100%);transition:transform .25s;}
    .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg);}
    .hamburger-btn{display:flex;}
    .grid-2,.grid-3,.grid-4{grid-template-columns:1fr;}
    .form-grid-2,.form-grid-3{grid-template-columns:1fr;}
    .shift-row{grid-template-columns:1fr;}
    .chat-shell{flex-direction:column;height:calc(100vh - 140px);}
    .chat-sidebar{width:100%;max-height:180px;border-right:none;border-bottom:1px solid var(--line);}

/* ===== DATE HELPERS (gleiche Logik wie intern.html, damit Status/Sortierung identisch bleiben) ===== */
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
function parseDmy(s){
  if(!s) return null;
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec(s.trim());
  if(!m) return null;
  const d = new Date(parseInt(m[3]), parseInt(m[2])-1, parseInt(m[1]));
  d.setHours(0,0,0,0);
  return d;
}
function formatLong(d){ return d.getDate()+'. '+MONATE[d.getMonth()]+' '+d.getFullYear(); }
function evDateLabel(ev){
  if(ev.dateMode==='soon') return 'Bald';
  const start = parseDmy(ev.startDate);
  if(!start) return ev.startDate || '';
  if(ev.dateMode==='range'){
    const end = parseDmy(ev.endDate);
    if(end) return formatLong(start)+' – '+formatLong(end);
  }
  return formatLong(start);
}
function evStatus(ev){
  if(ev.dateMode==='soon') return 'upcoming';
  const today = new Date(); today.setHours(0,0,0,0);
  const start = parseDmy(ev.startDate);
  const end = ev.dateMode==='range' ? parseDmy(ev.endDate) : start;
  if(!start) return 'upcoming';
  if(today < start) return 'upcoming';
  if(end && today > end) return 'done';
  if(end && today >= start && today <= end) return 'running';
  return today.getTime()===start.getTime() ? 'running' : 'done';
}
function evSortKey(ev){
  if(ev.dateMode==='soon') return Infinity-1;
  const start = parseDmy(ev.startDate);
  return start ? start.getTime() : Infinity;
}
function fmtTimestamp(ts){
  if(!ts || !ts.toDate) return '';
  const d = ts.toDate();
  return d.toLocaleDateString('de-DE') + ' · ' + d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}

const loginScreen = document.getElementById('loginScreen');
const appEl = document.getElementById('app');
const loginErr = document.getElementById('loginErr');
const loginBtn = document.getElementById('loginBtn');
const emailEl = document.getElementById('loginEmail');
const passEl = document.getElementById('loginPassword');

function showLoginErr(msg, type){
  loginErr.textContent = msg;
  loginErr.className = type==='info' ? 'info' : '';
  loginErr.style.display = 'block';
}
function clearLoginErr(){ loginErr.style.display = 'none'; }

async function doLogin(){
  const email = emailEl.value.trim();
  const password = passEl.value;
  if(!email || !password){ showLoginErr('Bitte E-Mail und Passwort eingeben.'); return; }
  clearLoginErr();
  loginBtn.disabled = true;
  loginBtn.innerHTML = '<span class="spinner"></span>Prüfe…';
  try{
    await signInWithEmailAndPassword(auth, email, password);
  }catch(err){
    let msg = 'Anmeldung fehlgeschlagen.';
    if(['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(err.code)) msg = 'Falsche E-Mail-Adresse oder Passwort.';
    else if(err.code==='auth/too-many-requests') msg = 'Zu viele Fehlversuche. Bitte später erneut versuchen.';
    else if(err.code==='auth/invalid-email') msg = 'Ungültige E-Mail-Adresse.';
    showLoginErr(msg);
    loginBtn.disabled = false;
    loginBtn.textContent = 'Einloggen';
  }
}
loginBtn.addEventListener('click', doLogin);
passEl.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });
emailEl.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

document.getElementById('logoutBtn').addEventListener('click', async () => {
  await signOut(auth);
});

onAuthStateChanged(auth, async (user) => {
  if(!user){
    CU = null;
    loginScreen.classList.remove('hidden');
    appEl.classList.remove('unlocked');
    loginBtn.disabled = false;
    loginBtn.textContent = 'Einloggen';
    return;
  }
  try{
    const snap = await getDoc(doc(db, 'users', user.uid));
    if(!snap.exists()){
      showLoginErr('Kein Profil für dieses Konto gefunden. Bitte einen Admin kontaktieren.');
      await signOut(auth);
      return;
    }
    const profile = snap.data();
    if(profile.role === 'pending'){
      showLoginErr('Dein Konto wartet noch auf Freischaltung durch einen Admin.', 'info');
      await signOut(auth);
      return;
    }
    if(profile.role === 'inactive'){
      showLoginErr('Dein Konto wurde deaktiviert. Bitte wende dich an einen Admin.');
      await signOut(auth);
      return;
    }
    CU = { id: user.uid, ...profile };
    loginScreen.classList.add('hidden');
    appEl.classList.add('unlocked');
    renderUserCard();
    buildSidebarNav();
    router();
  }catch(err){
    showLoginErr('Fehler beim Laden des Profils: ' + err.message);
    await signOut(auth);
  }
});

  }
  return '<div class="field-group"><label class="field-label">'+label+'</label><input type="text" id="'+id+'" placeholder="'+optionsOrPlaceholder+'"></div>';

async function saveEvent(){
  const name = document.getElementById('evName').value.trim();
  const desc = document.getElementById('evDesc').value.trim();
  const category = document.getElementById('evCategory').value;
  const dateMode = document.getElementById('evDateMode').value;
  const startDate = document.getElementById('evStart').value.trim();
  const endDate = document.getElementById('evEnd').value.trim();
  const tags = document.getElementById('evTags').value.split(',').map(t=>t.trim()).filter(Boolean);
  if(!name){ alert('Bitte einen Namen eingeben.'); return; }
  if(dateMode!=='soon'){
    if(!parseDmy(startDate)){ alert('Bitte Datum im Format TT.MM.JJJJ angeben.'); return; }
    if(dateMode==='range' && !parseDmy(endDate)){ alert('Bitte Enddatum im Format TT.MM.JJJJ angeben.'); return; }
  }
  const shifts = EV_PENDING_SHIFTS.filter(s=>s.task && s.task.trim());
  const payload = { name, desc, category, dateMode, startDate: dateMode==='soon'?'':startDate, endDate: dateMode==='range'?endDate:'', tags, shifts, materialIds: EV_PENDING_MATERIALS };
  const btn = document.getElementById('evSaveBtn');
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span>Speichert…';
  try{
    if(EV_EDIT_ID){ await updateDoc(doc(db,'events',EV_EDIT_ID), payload); }
    else{ await addDoc(collection(db,'events'), payload); }
    cancelEditEvent();
    loadEvents();
  }catch(err){ alert('Fehler beim Speichern: '+err.message); }
  btn.disabled = false; btn.textContent = 'Speichern';
}

}

async function loadEvents(){
  if(!Object.keys(USER_MAP_CACHE||{}).length) await loadUserMapCache();
  const snap = await getDocs(collection(db,'events'));
  EV_CACHE = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>evSortKey(a)-evSortKey(b));
  renderEvFilterRow();
  renderEvList();
}
function renderEvList(){
  const el = document.getElementById('evList');
  if(!el) return;
  const cm = can('events_manage');
  const list = EV_FILTER==='all' ? EV_CACHE : EV_CACHE.filter(ev=>evStatus(ev)===EV_FILTER);
  el.innerHTML = list.length ? list.map(ev=>{
    const st = evStatus(ev);
    const cat = ev.category || 'event';
    const shifts = ev.shifts || [];
    return '<div class="ev-row">'
      + '<div class="list-row-dot '+cat+'"></div>'
      + '<div class="list-row-text">'
      +   '<div class="list-row-title">'+ev.name+' <span class="tag-badge">'+EV_STATUS_LABELS[st]+'</span><span class="tag-badge cat-'+cat+'">'+EV_CAT_LABELS[cat]+'</span></div>'
      +   '<div class="list-row-meta">'+evDateLabel(ev)+(ev.tags&&ev.tags.length?' · '+ev.tags.join(', '):'')+'</div>'
      +   (shifts.length ? '<div class="shift-summary">🕐 '+shifts.map(s=>(s.task||'')+(s.assignee?' ('+(USER_MAP_CACHE[s.assignee]?.displayName||s.assignee)+')':'')).join(' · ')+'</div>' : '')
      + '</div>'
      + (cm ? '<div class="ev-row-actions"><button data-editev="'+ev.id+'">Bearbeiten</button><button data-delev="'+ev.id+'" class="danger">Löschen</button></div>' : '')
      + '</div>';
  }).join('') : '<div class="empty-hint">Keine Veranstaltungen in dieser Ansicht.</div>';
  if(cm){
    el.querySelectorAll('[data-editev]').forEach(b=>b.addEventListener('click', ()=>editEvent(b.dataset.editev)));
    el.querySelectorAll('[data-delev]').forEach(b=>b.addEventListener('click', ()=>deleteEvent(b.dataset.delev)));
  }
}

/* Gemeinsamer User-Map-Cache (Username -> {displayName, avatarUrl}) für mehrere Module */
let USER_MAP_CACHE = {};
async function loadUserMapCache(){
  const snap = await getDocs(collection(db,'users'));
  USER_MAP_CACHE = {};
  snap.docs.forEach(d=>{ const u=d.data(); USER_MAP_CACHE[u.username] = { displayName: u.displayName||u.username, avatarUrl: u.avatarUrl||'', role: u.role, id: d.id }; });
}

/* ============================================================
   MODUL: TEAM-CHAT
   ============================================================ */
const TC_MAIN_ID = 'main';
let TC_CONVS = [];
let TC_ACTIVE = null;
let unsubConvs = null;
let unsubActiveThread = null;

function tcDisplayName(username){ return (USER_MAP_CACHE[username]&&USER_MAP_CACHE[username].displayName) || username; }
function tcAvatarHtml(username){
  const u = USER_MAP_CACHE[username] || {};
  if(u.avatarUrl) return '<img src="'+u.avatarUrl+'" alt=""/>';
  return (u.displayName || username || '?').charAt(0).toUpperCase();
}

VIEW_RENDERERS['chat'] = async function(content){
  content.innerHTML =
    '<div class="chat-shell">'
    + '<div class="chat-sidebar">'
    +   '<div class="chat-sidebar-head"><span>Chats</span><div style="display:flex;gap:6px">'
    +     '<button class="chip-btn" id="tcNewDmBtn" title="Direktnachricht">+ DM</button>'
    +     '<button class="chip-btn" id="tcNewGroupBtn" title="Gruppe">+ Gruppe</button>'
    +     '<button class="chip-btn" id="tcNewVoiceBtn" title="Sprachkanal">+ 🎙️</button>'
    +   '</div></div>'
    +   '<div class="chat-conv-list" id="tcConvList"><div class="skel skel-line" style="width:80%"></div></div>'
    + '</div>'
    + '<div class="chat-main" id="tcMain"><div class="empty-hint" style="padding:60px 0">Wähle links einen Chat.</div></div>'
    + '</div>';
  await loadUserMapCache();
  await ensureMainChatExists();
  if(unsubConvs) unsubConvs();
  unsubConvs = onSnapshot(collection(db,'chat_conversations'), (snap)=>{
    TC_CONVS = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .filter(c=>c.type==='main' || c.type==='voice' || (c.members||[]).includes(CU.username));
    renderConvList();
  });
  document.getElementById('tcNewDmBtn').addEventListener('click', openNewDmModal);
  document.getElementById('tcNewGroupBtn').addEventListener('click', openNewGroupModal);
  document.getElementById('tcNewVoiceBtn').addEventListener('click', openNewVoiceModal);
};

async function ensureMainChatExists(){
  const ref_ = doc(db,'chat_conversations', TC_MAIN_ID);
  const snap = await getDoc(ref_);
  if(!snap.exists()){
    await setDoc(ref_, { type:'main', name:'Main-Chat', members:[], createdBy:'system', createdAt: serverTimestamp() });
  }
}

function convDisplayInfo(conv){
  if(conv.type==='main') return { name:'Main-Chat', sub:'Alle Mitglieder' };
  if(conv.type==='group') return { name: conv.name||'Gruppe', sub: (conv.members||[]).length+' Mitglieder' };
  if(conv.type==='voice') return { name: conv.name||'Sprachkanal', sub: '🎙️ Sprachkanal' };
  const other = (conv.members||[]).find(m=>m!==CU.username) || '?';
  return { name: tcDisplayName(other), sub:'', otherUser: other };
}

function renderConvList(){
  const el = document.getElementById('tcConvList');
  if(!el) return;
  const sorted = TC_CONVS.slice().sort((a,b)=>{ const order={main:0,group:1,voice:2,dm:3}; return (order[a.type]??4)-(order[b.type]??4); });
  el.innerHTML = sorted.map(c=>{
    const info = convDisplayInfo(c);
    const avatar = c.type==='main' ? '👥' : c.type==='voice' ? '🎙️' : c.type==='group' ? '👥' : tcAvatarHtml(info.otherUser);
    return '<div class="chat-conv-item '+(TC_ACTIVE===c.id?'active':'')+'" data-conv="'+c.id+'">'
      + '<div class="chat-conv-avatar">'+avatar+'</div>'
      + '<div class="chat-conv-text"><div class="chat-conv-name">'+info.name+'</div><div class="chat-conv-sub">'+(info.sub||'')+'</div></div>'
      + '</div>';
  }).join('') || '<div class="empty-hint">Keine Chats.</div>';
  el.querySelectorAll('[data-conv]').forEach(b=>b.addEventListener('click', ()=>openConversation(b.dataset.conv)));
}

function openConversation(convId){
  TC_ACTIVE = convId;
  renderConvList();
  const conv = TC_CONVS.find(c=>c.id===convId);
  if(!conv) return;
  if(conv.type==='voice'){ openVoiceChannel(conv); return; }

  const info = convDisplayInfo(conv);
  const isAdmin = CU.role==='admin';
  const groupAdmins = conv.admins || (conv.createdBy?[conv.createdBy]:[]);
  const canManage = conv.type==='group' && (groupAdmins.includes(CU.username) || isAdmin);
  const mainEl = document.getElementById('tcMain');
  mainEl.innerHTML =
    '<div class="chat-main-head">'
    + '<div><div class="chat-main-title">'+info.name+'</div>'+(info.sub?'<div class="chat-main-sub">'+info.sub+'</div>':'')+'</div>'
    + '<div style="display:flex;gap:8px">'
    +   (canManage ? '<button class="btn-secondary" id="tcManageBtn">Mitglieder</button>' : '')
    +   (conv.type==='group' && isAdmin ? '<button class="btn-secondary" id="tcDeleteGroupBtn" style="color:var(--danger)">Löschen</button>' : '')
    + '</div></div>'
    + '<div class="chat-thread" id="tcThread"><div class="skel skel-line" style="width:60%"></div></div>'
    + '<div class="chat-input-row"><textarea id="tcText" placeholder="Nachricht schreiben…"></textarea><button class="btn-primary" id="tcSend">Senden</button></div>';

  document.getElementById('tcSend').addEventListener('click', ()=>sendTeamMessage(convId));
  document.getElementById('tcText').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); sendTeamMessage(convId); } });
  const manageBtn = document.getElementById('tcManageBtn'); if(manageBtn) manageBtn.addEventListener('click', ()=>openManageGroupModal(conv));
  const delBtn = document.getElementById('tcDeleteGroupBtn'); if(delBtn) delBtn.addEventListener('click', ()=>deleteGroup(conv));

  if(unsubActiveThread) unsubActiveThread();
  unsubActiveThread = onSnapshot(query(collection(db,'chat_messages'), where('conversationId','==',convId)), (snap)=>{
    const items = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.createdAt?.toMillis?.()||0)-(b.createdAt?.toMillis?.()||0));
    const threadEl = document.getElementById('tcThread');
    if(!threadEl) return;
    const prevText = document.getElementById('tcText')?.value || '';
    threadEl.innerHTML = items.length ? items.map(tcBubbleHtml).join('') : '<div class="empty-hint">Noch keine Nachrichten.</div>';
    threadEl.querySelectorAll('[data-icdel]').forEach(b=>b.addEventListener('click', async()=>{ await deleteDoc(doc(db,'chat_messages', b.dataset.icdel)); }));
    threadEl.scrollTop = threadEl.scrollHeight;
    const ta = document.getElementById('tcText'); if(ta && prevText) ta.value = prevText;
  });
}

function tcBubbleHtml(m){
  const isOwn = m.username===CU.username;
  return '<div class="chat-bubble '+(isOwn?'own':'')+'">'
    + '<div class="chat-bubble-avatar">'+tcAvatarHtml(m.username)+'</div>'
    + '<div class="chat-bubble-content"><div class="chat-bubble-card"><div class="chat-bubble-name">'+tcDisplayName(m.username)+'</div>'
    + '<div class="chat-bubble-text">'+(m.text||'').replace(/</g,'&lt;')+'</div></div>'
    + '<div class="chat-bubble-time">'+fmtTimestamp(m.createdAt)+(isOwn||CU.role==='admin' ? ' · <button data-icdel="'+m.id+'" class="link-btn">Löschen</button>' : '')+'</div>'
    + '</div></div>';
}

async function sendTeamMessage(convId){
  const ta = document.getElementById('tcText');
  const text = ta.value.trim();
  if(!text) return;
  const btn = document.getElementById('tcSend');
  btn.disabled = true;
  try{
    await addDoc(collection(db,'chat_messages'), { conversationId: convId, username: CU.username, text, createdAt: serverTimestamp() });
    ta.value = '';
  }catch(err){ alert('Senden fehlgeschlagen: '+err.message); }
  btn.disabled = false;
}

function openVoiceChannel(conv){
  if(unsubActiveThread){ unsubActiveThread(); unsubActiveThread=null; }
  const isAdmin = CU.role==='admin';
  const mainEl = document.getElementById('tcMain');
  mainEl.innerHTML =
    '<div class="chat-main-head"><div><div class="chat-main-title">🎙️ '+(conv.name||'Sprachkanal')+'</div><div class="chat-main-sub">Audioübertragung über Jitsi Meet</div></div>'
    + (isAdmin ? '<button class="btn-secondary" id="tcDeleteVoiceBtn" style="color:var(--danger)">Kanal löschen</button>' : '')
    + '</div>'
    + '<div class="chat-voice-embed"><iframe allow="camera; microphone; fullscreen; display-capture; autoplay" src="https://meet.jit.si/'+encodeURIComponent(conv.jitsiRoom)+'#config.prejoinPageEnabled=true&userInfo.displayName=%22'+encodeURIComponent(CU.displayName||CU.username)+'%22"></iframe></div>';
  const delBtn = document.getElementById('tcDeleteVoiceBtn');
  if(delBtn) delBtn.addEventListener('click', async()=>{
    if(!confirm('Sprachkanal löschen?')) return;
    await deleteDoc(doc(db,'chat_conversations', conv.id));
    TC_ACTIVE = null;
    mainEl.innerHTML = '<div class="empty-hint" style="padding:60px 0">Wähle links einen Chat.</div>';
  });
}

function openNewDmModal(){
  const others = Object.keys(USER_MAP_CACHE).filter(u=>u!==CU.username);
  const body = others.map(u=>'<div class="modal-pick-row" data-pickdm="'+u+'">'+tcDisplayName(u)+'</div>').join('');
  showModal('Direktnachricht starten', '<div class="modal-pick-list">'+body+'</div>', null);
  document.querySelectorAll('[data-pickdm]').forEach(row=>row.addEventListener('click', async()=>{
    closeModal();
    const other = row.dataset.pickdm;
    const existing = TC_CONVS.find(c=>c.type==='dm' && (c.members||[]).includes(other) && (c.members||[]).includes(CU.username));
    if(existing){ openConversation(existing.id); return; }
    const ref_ = await addDoc(collection(db,'chat_conversations'), { type:'dm', members:[CU.username, other], createdBy:CU.username, createdAt: serverTimestamp() });
    setTimeout(()=>openConversation(ref_.id), 200);
  }));
}
function openNewGroupModal(){
  const others = Object.keys(USER_MAP_CACHE).filter(u=>u!==CU.username);
  const body = '<div class="field-group"><label class="field-label">Gruppenname</label><input type="text" id="mGroupName" placeholder="z.B. Lichtteam"></div>'
    + '<label class="field-label">Mitglieder</label><div class="modal-pick-list">'+others.map(u=>'<label class="modal-check-row"><input type="checkbox" value="'+u+'"> '+tcDisplayName(u)+'</label>').join('')+'</div>';
  showModal('Neue Gruppe', body, async(modalEl)=>{
    const name = modalEl.querySelector('#mGroupName').value.trim();
    const checked = [...modalEl.querySelectorAll('input[type=checkbox]:checked')].map(c=>c.value);
    if(!name){ alert('Bitte Gruppennamen eingeben.'); return false; }
    if(!checked.length){ alert('Bitte mindestens ein Mitglied wählen.'); return false; }
    await addDoc(collection(db,'chat_conversations'), { type:'group', name, members:[...new Set([CU.username,...checked])], admins:[CU.username], createdBy:CU.username, createdAt: serverTimestamp() });
    return true;
  });
}
function openNewVoiceModal(){
  const body = '<div class="field-group"><label class="field-label">Name des Kanals</label><input type="text" id="mVoiceName" placeholder="z.B. Technik-Besprechung"></div>'
    + '<p style="font-size:12px;color:var(--ink-faint)">Sprachkanäle sind für alle Mitglieder offen (Jitsi Meet, kein Konto nötig).</p>';
  showModal('Neuer Sprachkanal', body, async(modalEl)=>{
    const name = modalEl.querySelector('#mVoiceName').value.trim();
    if(!name){ alert('Bitte einen Namen eingeben.'); return false; }
    const roomName = 'gwt-'+name.replace(/[^a-zA-Z0-9]/g,'')+'-'+Date.now().toString(36);
    await addDoc(collection(db,'chat_conversations'), { type:'voice', name, jitsiRoom: roomName, createdBy: CU.username, createdAt: serverTimestamp() });
    return true;
  });
}
function openManageGroupModal(conv){
  const others = Object.keys(USER_MAP_CACHE).filter(u=>u!==CU.username);
  const members = conv.members||[]; const admins = conv.admins||(conv.createdBy?[conv.createdBy]:[]);
  const body = '<div class="field-group"><label class="field-label">Gruppenname</label><input type="text" id="mGroupName" value="'+(conv.name||'')+'"></div>'
    + '<label class="field-label">Mitglieder & Admins</label><div class="modal-pick-list">'
    + others.map(u=>'<label class="modal-check-row"><input type="checkbox" value="'+u+'" data-member="'+u+'" '+(members.includes(u)?'checked':'')+'> '+tcDisplayName(u)
      +'<label style="margin-left:auto;font-size:11px"><input type="checkbox" data-admin-for="'+u+'" '+(admins.includes(u)?'checked':'')+'> Admin</label></label>').join('')
    + '</div>';
  showModal('Mitglieder verwalten', body, async(modalEl)=>{
    const name = modalEl.querySelector('#mGroupName').value.trim();
    if(!name){ alert('Bitte Gruppennamen eingeben.'); return false; }
    const checkedMembers = [...modalEl.querySelectorAll('[data-member]:checked')].map(c=>c.dataset.member);
    const checkedAdmins = [...modalEl.querySelectorAll('[data-admin-for]:checked')].map(c=>c.dataset.adminFor);
    const newMembers = [...new Set([CU.username,...checkedMembers])];
    let newAdmins = [...new Set(checkedAdmins.filter(a=>newMembers.includes(a)))];
    if(!newAdmins.length) newAdmins.push(CU.username);
    await updateDoc(doc(db,'chat_conversations',conv.id), { name, members:newMembers, admins:newAdmins });
    return true;
  });
}
async function deleteGroup(conv){
  if(!confirm('Gruppe "'+(conv.name||'')+'" wirklich löschen?')) return;
  const msgSnap = await getDocs(query(collection(db,'chat_messages'), where('conversationId','==',conv.id)));
  await Promise.all(msgSnap.docs.map(d=>deleteDoc(doc(db,'chat_messages',d.id))));
  await deleteDoc(doc(db,'chat_conversations',conv.id));
  TC_ACTIVE = null;
  document.getElementById('tcMain').innerHTML = '<div class="empty-hint" style="padding:60px 0">Wähle links einen Chat.</div>';
}

/* Wiederverwendbares Modal (für Chat-Dialoge und weitere Module) */
function showModal(title, bodyHtml, onSave){
  let overlay = document.getElementById('genericModalOverlay');
  if(!overlay){
    overlay = document.createElement('div');
    overlay.id = 'genericModalOverlay';
    overlay.className = 'modal-overlay';
    document.body.appendChild(overlay);
  }
  overlay.innerHTML =
    '<div class="modal-box"><h3>'+title+'</h3><div id="genericModalBody">'+bodyHtml+'</div>'
    + '<div class="modal-actions"><button class="btn-secondary" id="genericModalCancel">Abbrechen</button>'
    + (onSave ? '<button class="btn-primary" id="genericModalSave">Speichern</button>' : '')
    + '</div></div>';
  overlay.classList.add('open');
  overlay.querySelector('#genericModalCancel').addEventListener('click', closeModal);
  overlay.addEventListener('click', e=>{ if(e.target===overlay) closeModal(); });
  if(onSave){
    overlay.querySelector('#genericModalSave').addEventListener('click', async()=>{
      const ok = await onSave(overlay.querySelector('#genericModalBody'));
      if(ok!==false) closeModal();
    });
  }
}
function closeModal(){
  const overlay = document.getElementById('genericModalOverlay');
  if(overlay) overlay.classList.remove('open');
}

let unsubTodos = null;
VIEW_RENDERERS['todos'] = function(content){
  content.innerHTML =
    '<div class="card">'
    + '<div class="field-group" style="max-width:520px"><label class="field-label">Neues ToDo</label>'
    +   '<div style="display:flex;gap:10px"><input type="text" id="todoNewInput" placeholder="z.B. Mischpult für Konzert vorbereiten" style="flex:1"><button class="btn-primary" id="todoAddBtn">Hinzufügen</button></div></div>'
    + '<div id="todoListEl" style="margin-top:14px"><div class="skel skel-line" style="width:70%"></div></div>'
    + '</div>';
  document.getElementById('todoAddBtn').addEventListener('click', addTodoItem);
  document.getElementById('todoNewInput').addEventListener('keydown', e=>{ if(e.key==='Enter') addTodoItem(); });
  if(unsubTodos) unsubTodos();
  unsubTodos = onSnapshot(collection(db,'todos'), (snap)=>{
    const items = snap.docs.map(d=>({id:d.id, ...d.data()}))
      .sort((a,b)=>(a.done?1:0)-(b.done?1:0) || (b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
    renderTodoList(items);
  });
};
function renderTodoList(items){
  const el = document.getElementById('todoListEl');
  if(!el) return;
  el.innerHTML = items.length ? items.map(t=>
    '<div class="todo-row" style="border-bottom:1px solid var(--line);padding:10px 0">'
    + '<div class="todo-check '+(t.done?'done':'')+'" data-toggletodo="'+t.id+'">'+(t.done?'✓':'')+'</div>'
    + '<div class="todo-text '+(t.done?'done':'')+'">'+(t.text||'').replace(/</g,'&lt;')+'</div>'
    + '<div style="font-size:11px;color:var(--ink-faint);margin-left:auto">'+(t.createdBy?tcDisplayName(t.createdBy):'')+'</div>'
    + '<button data-deltodo="'+t.id+'" class="link-btn" style="margin-left:8px">✕</button>'
    + '</div>'
  ).join('') : '<div class="empty-hint">Keine ToDos vorhanden.</div>';
  el.querySelectorAll('[data-toggletodo]').forEach(b=>b.addEventListener('click', async()=>{
    await updateDoc(doc(db,'todos', b.dataset.toggletodo), { done: !b.classList.contains('done') });
  }));
  el.querySelectorAll('[data-deltodo]').forEach(b=>b.addEventListener('click', async()=>{
    await deleteDoc(doc(db,'todos', b.dataset.deltodo));
  }));
}
async function addTodoItem(){
  const input = document.getElementById('todoNewInput');
  const text = input.value.trim();
  if(!text) return;
  await addDoc(collection(db,'todos'), { text, done:false, createdBy: CU.username, createdAt: serverTimestamp() });
  input.value = '';
}

let unsubInventory = null;
let INV_FILTER = '';
let INV_CACHE = [];
const INV_STATUS_LABELS = { available:'Verfügbar', broken:'Defekt', inuse:'Verwendet' };

VIEW_RENDERERS['inventar'] = function(content){
  const cm = can('events_manage');
  content.innerHTML =
    '<div class="card">'
    + (cm ? '<div class="form-grid-3"><div class="field-group"><label class="field-label">Gerätename</label><input type="text" id="invNewName" placeholder="z.B. Behringer X32"></div>'
      + '<div class="field-group"><label class="field-label">Kategorie</label><input type="text" id="invNewCat" placeholder="z.B. Mischpult"></div>'
      + '<div class="field-group" style="justify-content:flex-end"><button class="btn-primary" id="invAddBtn" style="width:100%">Hinzufügen</button></div></div>' : '')
    + '<div class="ev-filter-row" id="invFilterRow"></div>'
    + '<div class="grid grid-3" id="invGrid"><div class="skel skel-line" style="width:60%"></div></div>'
    + '</div>';
  if(cm) document.getElementById('invAddBtn').addEventListener('click', addInventoryItem);
  renderInvFilterRow();
  if(unsubInventory) unsubInventory();
  unsubInventory = onSnapshot(collection(db,'inventory'), (snap)=>{
    INV_CACHE = snap.docs.map(d=>({id:d.id, ...d.data()})).sort((a,b)=>(a.name||'').localeCompare(b.name||''));
    renderInvGrid();
  });
};
function renderInvFilterRow(){
  const el = document.getElementById('invFilterRow');
  if(!el) return;
  const filters = [['','Alle'],['available','Verfügbar'],['broken','Defekt'],['inuse','Verwendet']];
  el.innerHTML = filters.map(([id,label])=>'<button class="filter-chip '+(INV_FILTER===id?'active':'')+'" data-invf="'+id+'">'+label+'</button>').join('');
  el.querySelectorAll('[data-invf]').forEach(b=>b.addEventListener('click', ()=>{ INV_FILTER=b.dataset.invf; renderInvFilterRow(); renderInvGrid(); }));
}
function renderInvGrid(){
  const el = document.getElementById('invGrid');
  if(!el) return;
  const cm = can('events_manage');
  const list = INV_FILTER ? INV_CACHE.filter(i=>i.status===INV_FILTER) : INV_CACHE;
  el.innerHTML = list.length ? list.map(i=>
    '<div class="card" style="padding:14px 16px;border-left:3px solid '+(i.status==='broken'?'var(--danger)':i.status==='inuse'?'var(--warn)':'var(--accent)')+'">'
    + '<div style="font-weight:600;font-size:13.5px">'+i.name+'</div>'
    + (i.category ? '<div style="font-size:11.5px;color:var(--ink-faint);margin-bottom:8px">'+i.category+'</div>' : '')
    + '<select class="inv-status-select" data-invstatus="'+i.id+'" style="width:100%;margin-bottom:8px">'
    +   Object.keys(INV_STATUS_LABELS).map(s=>'<option value="'+s+'" '+((i.status||'available')===s?'selected':'')+'>'+INV_STATUS_LABELS[s]+'</option>').join('')
    + '</select>'
    + (cm ? '<button data-invdel="'+i.id+'" class="link-btn">Löschen</button>' : '')
    + '</div>'
  ).join('') : '<div class="empty-hint">Keine Geräte in dieser Ansicht.</div>';
  el.querySelectorAll('[data-invstatus]').forEach(sel=>sel.addEventListener('change', async()=>{
    await updateDoc(doc(db,'inventory', sel.dataset.invstatus), { status: sel.value });
  }));
  el.querySelectorAll('[data-invdel]').forEach(b=>b.addEventListener('click', async()=>{
    if(!confirm('Gerät wirklich löschen?')) return;
    await deleteDoc(doc(db,'inventory', b.dataset.invdel));
  }));
}
async function addInventoryItem(){
  const name = document.getElementById('invNewName').value.trim();
  const category = document.getElementById('invNewCat').value.trim();
  if(!name) return;
  await addDoc(collection(db,'inventory'), { name, category, status:'available' });
  document.getElementById('invNewName').value = '';
  document.getElementById('invNewCat').value = '';
}


function renderView(viewId){
  const content = document.getElementById('content');
  if(viewId === 'dashboard'){ renderDashboard(content); return; }
  if(VIEW_RENDERERS[viewId]){ VIEW_RENDERERS[viewId](content); return; }
  content.innerHTML =
    '<div class="placeholder-view">'
    +'<div class="ic">🚧</div>'
    +'<h2>'+((VIEW_TITLES[viewId]||['Dieser Bereich'])[0])+' folgt bald</h2>'
    +'<p>Dieser Teil von gwtOrgatool ist noch im Aufbau. Nutze bis dahin weiterhin den <a href="https://gymwentechnik.de/intern.html" style="color:var(--accent)">bisherigen internen Bereich</a>.</p>'
    +'</div>';
}

/* ===== DASHBOARD ===== */
async function renderDashboard(content){
  content.innerHTML =
    '<div class="grid grid-4" style="margin-bottom:16px">'
    +'<div class="card stat-card accent"><div class="stat-num" id="statUpcoming">–</div><div class="stat-label">Anstehende Events</div></div>'
    +'<div class="card stat-card"><div class="stat-num" id="statTodos">–</div><div class="stat-label">Offene ToDos</div></div>'
    +'<div class="card stat-card"><div class="stat-num" id="statInventory">–</div><div class="stat-label">Defekte Geräte</div></div>'
    +'<div class="card stat-card accent2"><div class="stat-num" id="statMembers">–</div><div class="stat-label">Aktive Mitglieder</div></div>'
    +'</div>'
    +'<div class="grid grid-2">'
    +'<div class="card"><div class="card-title">Nächste Veranstaltungen<a href="#/events">Alle ansehen →</a></div><div id="dashEvents"><div class="skel skel-line" style="width:90%"></div><div class="skel skel-line" style="width:70%"></div><div class="skel skel-line" style="width:80%"></div></div></div>'
    +'<div class="card"><div class="card-title">Offene ToDos<a href="#/todos">Alle ansehen →</a></div><div id="dashTodos"><div class="skel skel-line" style="width:85%"></div><div class="skel skel-line" style="width:60%"></div></div></div>'
    +'</div>';

  loadDashboardData();
}

async function loadDashboardData(){
  try{
    const [evSnap, todoSnap, invSnap, userSnap] = await Promise.all([
      getDocs(collection(db,'events')),
      getDocs(collection(db,'todos')),
      getDocs(collection(db,'inventory')),
      getDocs(collection(db,'users'))
    ]);

    const events = evSnap.docs.map(d => ({id:d.id, ...d.data()}))
      .filter(ev => ev.category !== 'probe' || can('events_view'))
      .sort((a,b) => evSortKey(a)-evSortKey(b));
    const upcoming = events.filter(ev => evStatus(ev) !== 'done');

    const todos = todoSnap.docs.map(d => ({id:d.id, ...d.data()}));
    const openTodos = todos.filter(t => !t.done);

    const inventory = invSnap.docs.map(d => ({id:d.id, ...d.data()}));
    const broken = inventory.filter(i => i.status === 'broken');

    const users = userSnap.docs.map(d => d.data());
    const activeUsers = users.filter(u => u.role && u.role !== 'pending' && u.role !== 'inactive');

    document.getElementById('statUpcoming').textContent = upcoming.length;
    document.getElementById('statTodos').textContent = openTodos.length;
    document.getElementById('statInventory').textContent = broken.length;
    document.getElementById('statMembers').textContent = activeUsers.length;

    const evEl = document.getElementById('dashEvents');
    const nextEvents = upcoming.slice(0,5);
    evEl.innerHTML = nextEvents.length ? nextEvents.map(ev =>
      '<div class="list-row">'
      +'<div class="list-row-dot '+(ev.category||'event')+'"></div>'
      +'<div class="list-row-text"><div class="list-row-title">'+ev.name+'</div><div class="list-row-meta">'+evDateLabel(ev)+'</div></div>'
      +'</div>'
    ).join('') : '<div class="empty-hint">Keine anstehenden Veranstaltungen.</div>';

    const todoEl = document.getElementById('dashTodos');
    const nextTodos = openTodos.slice(0,6);
    todoEl.innerHTML = nextTodos.length ? nextTodos.map(t =>
      '<div class="todo-row"><div class="todo-check" data-todoid="'+t.id+'"></div><div class="todo-text">'+(t.text||'').replace(/</g,'&lt;')+'</div></div>'
    ).join('') : '<div class="empty-hint">Keine offenen ToDos – gut gemacht!</div>';
    todoEl.querySelectorAll('[data-todoid]').forEach(el => {
      el.addEventListener('click', async () => {
        await updateDoc(doc(db,'todos', el.dataset.todoid), { done: true });
        loadDashboardData();
      });
    });
  }catch(err){
    document.getElementById('dashEvents').innerHTML = '<div class="empty-hint">Fehler beim Laden: '+err.message+'</div>';
  }
}

/* ===== SIDEBAR TOGGLE (mobil) ===== */
document.getElementById('hamburgerBtn').addEventListener('click', () => {
  document.getElementById('sidebar').classList.toggle('open');
});

document.addEventListener('keydown', (e) => {
  if((e.ctrlKey || e.metaKey) && e.key === 'k'){
    e.preventDefault();
    document.getElementById('globalSearch').focus();
  }
});
