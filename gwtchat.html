<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://gymwentechnik.de/gwt-global.js"></script>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://gymwentechnik.de/gwt-shared.css">
<title>gwtChat – GymWenTechnik</title>
<meta name="robots" content="noindex" />
<style>
  .login{max-width:520px;}
  .login h2{font:600 2rem/1.1 var(--display);margin-bottom:.6rem;}
  .login>p{color:var(--muted);margin-bottom:1.6rem;}
  .field{display:flex;flex-direction:column;gap:.3rem;margin-bottom:1.2rem;}
  .field label{font-size:.85rem;color:var(--muted);}
  .field input,.reply textarea{width:100%;background:none;border:0;border-bottom:1.5px solid var(--line);color:var(--fg);font:400 1.05rem var(--sans);padding:.6rem 0;outline:0;border-radius:0;}
  .field input:focus,.reply textarea:focus{border-color:var(--fg);}
  .err{color:var(--magenta);font-size:.92rem;min-height:1.4em;margin:.4rem 0 1rem;}
  html.dark .err{color:#ff7ac6;}
  .hint{margin-top:1.6rem;font-size:.92rem;color:var(--muted);}
  .hint a{text-decoration:underline;text-underline-offset:3px;color:var(--fg);}
  #chatView{display:none;max-width:760px;}
  .chat-top{display:flex;justify-content:space-between;align-items:center;gap:1rem;border-bottom:1px solid var(--fg);padding-bottom:.8rem;margin-bottom:.8rem;}
  .chat-top h2{font:600 1.6rem/1.1 var(--display);}
  .out{background:none;border:1px solid var(--fg);color:var(--fg);border-radius:100px;padding:.35rem 1.1rem;font:500 .9rem var(--sans);cursor:pointer;}
  .chat-sub{color:var(--muted);margin-bottom:1.4rem;}
  .thread{display:flex;flex-direction:column;gap:.9rem;max-height:55vh;overflow-y:auto;padding:.4rem .2rem 1rem;}
  .bubble{max-width:82%;padding:.9rem 1.2rem;border-radius:20px;background:var(--card);border:1px solid var(--line);border-bottom-left-radius:6px;}
  .bubble.mine{align-self:flex-end;background:var(--fg);color:var(--bg);border-color:var(--fg);border-bottom-left-radius:20px;border-bottom-right-radius:6px;}
  .b-head{display:flex;justify-content:space-between;gap:1.2rem;font-size:.8rem;margin-bottom:.3rem;opacity:.75;}
  .b-head b{font-weight:600;}
  .b-subj{font-size:.8rem;font-weight:600;margin-bottom:.3rem;}
  .b-text{white-space:pre-wrap;overflow-wrap:anywhere;}
  .reply{display:flex;gap:1rem;align-items:flex-end;margin-top:1rem;}
  .reply textarea{min-height:56px;resize:vertical;}
  .reply .btn[disabled]{opacity:.5;cursor:default;}
  .empty{color:var(--muted);padding:1rem 0;}
</style>
</head>
<body data-page="gwtchat">
<header class="page-hero">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="crumb"><a href="https://gymwentechnik.de">Startseite</a> / gwtChat</div>
  <h1><span data-cms-key="hero.title">gwtChat</span></h1>
</header>

<main class="wrap"><div class="inner">
  <form class="login" id="loginBox" novalidate>
    <h2 data-cms-key="login.title">Anmelden</h2>
    <p data-cms-key="login.text">Gib deine Vorgangsnummer und deinen Nachnamen ein, um deinen Chat mit der GymWenTechnik zu öffnen.</p>
    <div class="field"><label for="loginCase">Vorgangsnummer</label><input type="text" id="loginCase" placeholder="z. B. V091245" autocomplete="off" autocapitalize="characters"></div>
    <div class="field"><label for="loginLast">Nachname</label><input type="text" id="loginLast" autocomplete="family-name"></div>
    <div class="err" id="loginError" role="alert"></div>
    <button type="submit" class="btn" id="loginBtn">Chat öffnen</button>
    <p class="hint">Noch keine Vorgangsnummer? <a href="https://gymwentechnik.de/kontakt.html">Zum Kontaktformular</a></p>
  </form>

  <section id="chatView" aria-label="Chat">
    <div class="chat-top"><h2 id="chatCaseTitle">Vorgang</h2><button type="button" class="out" id="logoutBtn">Abmelden</button></div>
    <p class="chat-sub">Hier siehst du den Verlauf deiner Anfrage. Antworten der GymWenTechnik erscheinen automatisch.</p>
    <div class="thread" id="gwtThread" aria-live="polite"></div>
    <div class="reply">
      <textarea id="gwtReplyText" placeholder="Nachricht schreiben (Enter zum Senden, Umschalt+Enter für Zeilenumbruch)" aria-label="Nachricht"></textarea>
      <button type="button" class="btn" id="gwtReplySend">Senden</button>
    </div>
    <div class="err" id="sendError" role="alert"></div>
  </section>
</div></main>

<script type="module" src="https://gymwentechnik.de/gwt-shared.js"></script>
<script type="module">
import { db, esc } from "https://gymwentechnik.de/gwt-shared.js";
import { collection, getDocs, addDoc, query, where, onSnapshot, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

let CASE = null, LAST = null, unsub = null, CACHE = [];
const $ = id => document.getElementById(id);
const fmt = ts => { if (!ts || !ts.toDate) return ''; const d = ts.toDate(); return d.toLocaleDateString('de-DE') + ' · ' + d.toLocaleTimeString('de-DE', { hour: '2-digit', minute: '2-digit' }); };

function bubble(m) {
  const staff = m.fromStaff === true;
  const name = staff ? (m.anonymous ? 'GymWenTechnik' : (m.staffDisplayName || 'GymWenTechnik')) : ((m.firstName || '') + ' ' + (m.lastName || '')).trim();
  return '<div class="bubble' + (staff ? '' : ' mine') + '"><div class="b-head"><b>' + esc(name) + '</b><span>' + esc(fmt(m.createdAt)) + '</span></div>'
    + (m.subject ? '<div class="b-subj">' + esc(m.subject) + '</div>' : '')
    + '<div class="b-text">' + esc(m.message) + '</div></div>';
}
function listen() {
  if (unsub) unsub();
  unsub = onSnapshot(query(collection(db, 'contact_messages'), where('caseNumber', '==', CASE)), { includeMetadataChanges: true }, snap => {
    CACHE = snap.docs.map(d => ({ id: d.id, ...d.data() })).sort((a, b) => (a.createdAt?.toMillis?.() || 0) - (b.createdAt?.toMillis?.() || 0));
    const el = $('gwtThread');
    el.innerHTML = CACHE.length ? CACHE.map(bubble).join('') : '<p class="empty">Noch keine Nachrichten in diesem Vorgang.</p>';
    el.scrollTop = el.scrollHeight;
  }, () => { $('gwtThread').innerHTML = '<p class="empty">Der Chat konnte nicht live geladen werden. Lade die Seite neu.</p>'; });
}

$('loginBox').addEventListener('submit', async e => {
  e.preventDefault();
  const c = $('loginCase').value.trim().toUpperCase(), l = $('loginLast').value.trim(), err = $('loginError');
  err.textContent = '';
  if (!/^V\d{6}$/.test(c)) { err.textContent = 'Die Vorgangsnummer besteht aus V und 6 Ziffern, z. B. V091245.'; return; }
  if (!l) { err.textContent = 'Bitte gib deinen Nachnamen ein.'; return; }
  const btn = $('loginBtn'); btn.disabled = true;
  try {
    const snap = await getDocs(query(collection(db, 'contact_messages'), where('caseNumber', '==', c)));
    if (!snap.docs.some(d => (d.data().lastName || '').toLowerCase() === l.toLowerCase())) {
      err.textContent = 'Keine Übereinstimmung. Prüfe Vorgangsnummer und Nachname.'; btn.disabled = false; return;
    }
    CASE = c; LAST = l;
    $('chatCaseTitle').textContent = 'Vorgang ' + CASE;
    $('loginBox').style.display = 'none'; $('chatView').style.display = 'block';
    $('gwtThread').innerHTML = '<p class="empty">Lade…</p>';
    listen(); $('gwtReplyText').focus();
  } catch (x) { err.textContent = 'Der Chat konnte nicht geladen werden. Versuch es gleich noch einmal.'; }
  btn.disabled = false;
});

$('logoutBtn').addEventListener('click', () => {
  if (unsub) { unsub(); unsub = null; }
  CASE = LAST = null; CACHE = [];
  $('loginCase').value = ''; $('loginLast').value = '';
  $('chatView').style.display = 'none'; $('loginBox').style.display = 'block'; $('loginCase').focus();
});

async function send() {
  const ta = $('gwtReplyText'), text = ta.value.trim(), err = $('sendError');
  if (!text || !CASE) return;
  err.textContent = ''; const btn = $('gwtReplySend'); btn.disabled = true;
  try {
    const first = CACHE.find(m => !m.fromStaff) || {};
    await addDoc(collection(db, 'contact_messages'), {
      caseNumber: CASE, firstName: first.firstName || '', lastName: LAST, email: first.email || '',
      subject: '', message: text, fromStaff: false, createdAt: serverTimestamp(), read: false
    });
    ta.value = '';
  } catch (x) { err.textContent = 'Senden fehlgeschlagen. Deine Nachricht steht noch im Feld, versuch es erneut.'; }
  btn.disabled = false;
}
$('gwtReplySend').addEventListener('click', send);
$('gwtReplyText').addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); } });
</script>
<script type="module" src="https://gymwentechnik.de/gwt-theme.js"></script>
</body>
</html>
