<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://gymwentechnik.de/gwt-global.js"></script>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://gymwentechnik.de/gwt-shared.css">
<title>Suche – GymWenTechnik</title>
<meta name="description" content="Veranstaltungen, News und Fotos der GymWenTechnik durchsuchen." />
<style>
  .sbox{display:flex;gap:1.2rem;align-items:flex-end;border-bottom:2px solid var(--fg);margin-bottom:2.5rem;}
  .sbox input{flex:1;min-width:0;background:none;border:0;outline:0;color:var(--fg);font:500 clamp(1.6rem,4vw,3rem)/1.2 var(--display);padding:.5rem 0;}
  .sbox input::placeholder{color:var(--muted);opacity:.7;}
  .sbox .btn{margin-bottom:.6rem;}
  .group-title{font-family:var(--display);font-weight:600;font-size:1.5rem;margin:2.5rem 0 .6rem;}
  .result{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:1.2rem;align-items:center;padding:1.1rem 0;border-top:1px solid var(--line);text-decoration:none;}
  .result:hover .r-title{text-decoration:underline;text-underline-offset:4px;}
  .r-title{font-weight:500;font-size:1.05rem;}
  .r-meta{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere;}
  .thumb{width:64px;height:48px;object-fit:cover;border-radius:8px;background:var(--line);}
  .badge{border:1px solid var(--fg);border-radius:100px;padding:.15rem .8rem;font-size:.78rem;white-space:nowrap;}
  .result:not(:has(.thumb)){grid-template-columns:minmax(0,1fr) auto;}
  mark{background:var(--lime);color:var(--ink);padding:0 .1em;border-radius:3px;}
  @media(max-width:560px){.sbox .btn{display:none;}}
</style>
</head>
<body data-page="suche">
<header class="page-hero">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="crumb"><a href="https://gymwentechnik.de">Startseite</a> / Suche</div>
  <h1><span data-cms-key="suche.title">Suche</span></h1>
</header>
<main class="wrap"><div class="inner">
  <form class="sbox" id="searchForm" role="search">
    <input type="search" id="searchInput" placeholder="Event, News oder Foto suchen" autocomplete="off" aria-label="Suchbegriff" />
    <button type="submit" class="btn">Suchen</button>
  </form>
  <div id="searchResults" aria-live="polite"><p class="empty-state">Gib mindestens 2 Zeichen ein.</p></div>
</div></main>

<script type="module" src="https://gymwentechnik.de/gwt-shared.js"></script>
<script type="module">
import { db, esc } from "https://gymwentechnik.de/gwt-shared.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const out = document.getElementById('searchResults');
const input = document.getElementById('searchInput');
let cache = null;

// Treffer hervorheben; Text wird stückweise escaped, daher kein HTML aus der Datenbank im DOM
function hl(text, q) {
  text = String(text == null ? '' : text);
  const lo = text.toLowerCase();
  let res = '', i = 0, j;
  while (q && (j = lo.indexOf(q, i)) !== -1) {
    res += esc(text.slice(i, j)) + '<mark>' + esc(text.slice(j, j + q.length)) + '</mark>';
    i = j + q.length;
  }
  return res + esc(text.slice(i));
}
const has = (s, q) => String(s || '').toLowerCase().includes(q);
const safeUrl = u => /^https:\/\//i.test(u || '') ? u : '';

async function load() {
  if (cache) return cache;
  const [ev, nw, gl] = await Promise.all(['events', 'news', 'gallery'].map(c => getDocs(collection(db, c))));
  const map = s => s.docs.map(d => ({ id: d.id, ...d.data() }));
  cache = { events: map(ev), news: map(nw), gallery: map(gl) };
  return cache;
}

async function runSearch(raw) {
  const q = (raw || '').trim().toLowerCase();
  history.replaceState(null, '', q ? '?q=' + encodeURIComponent(q) : location.pathname);
  if (q.length < 2) { out.innerHTML = '<p class="empty-state">Gib mindestens 2 Zeichen ein.</p>'; return; }
  out.innerHTML = '<p class="empty-state">Suche läuft…</p>';
  let data;
  try { data = await load(); }
  catch (e) { out.innerHTML = '<p class="empty-state">Die Suche ist gerade nicht erreichbar. Lade die Seite neu und versuche es noch einmal.</p>'; return; }

  const events = data.events.filter(e => e.category !== 'probe' && (has(e.name, q) || has(e.desc, q)));
  const news = data.news.filter(n => has(n.title, q) || has(n.body, q));
  const gal = data.gallery.filter(g => has(g.caption, q) || has(g.alt, q));

  let html = '';
  if (events.length) {
    html += '<h2 class="group-title">Veranstaltungen (' + events.length + ')</h2>' + events.map(e =>
      '<a class="result" href="https://gymwentechnik.de/veranstaltungen.html"><div><div class="r-title">' + hl(e.name, q) + '</div><div class="r-meta">' + hl(e.desc, q) + '</div></div><span class="badge">Event</span></a>').join('');
  }
  if (news.length) {
    html += '<h2 class="group-title">News (' + news.length + ')</h2>' + news.map(n =>
      '<a class="result" href="https://gymwentechnik.de/news.html"><div><div class="r-title">' + hl(n.title, q) + '</div><div class="r-meta">' + hl(String(n.body || '').slice(0, 120), q) + '</div></div><span class="badge">News</span></a>').join('');
  }
  if (gal.length) {
    html += '<h2 class="group-title">Galerie (' + gal.length + ')</h2>' + gal.map(g => {
      const u = safeUrl(g.url), label = g.caption || g.alt || 'Foto';
      return '<a class="result" href="https://gymwentechnik.de/galerie.html">'
        + (u && !g.isVideo ? '<img class="thumb" src="' + esc(u) + '" alt="" loading="lazy">' : '')
        + '<div class="r-title">' + hl(label, q) + '</div><span class="badge">' + (g.isVideo ? 'Video' : 'Foto') + '</span></a>';
    }).join('');
  }
  out.innerHTML = html || '<p class="empty-state">Keine Treffer für „' + esc(raw.trim()) + '“. Versuche ein kürzeres oder anderes Stichwort.</p>';
}

let t;
input.addEventListener('input', () => { clearTimeout(t); t = setTimeout(() => runSearch(input.value), 250); });
document.getElementById('searchForm').addEventListener('submit', e => { e.preventDefault(); clearTimeout(t); runSearch(input.value); });

const initQ = new URLSearchParams(location.search).get('q');
if (initQ) { input.value = initQ; runSearch(initQ); }
</script>
<script type="module" src="https://gymwentechnik.de/gwt-theme.js"></script>
</body>
</html>
