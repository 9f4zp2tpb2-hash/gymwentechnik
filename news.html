<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://gymwentechnik.de/gwt-global.js"></script>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://gymwentechnik.de/gwt-shared.css">
<title>News – GymWenTechnik</title>
<meta name="description" content="Aktuelle Neuigkeiten der GymWenTechnik, Bühnentechnik am Gymnasium Wendelstein." />
<style>
  .news-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2.4fr);gap:3rem;padding:2.2rem 0;border-top:1px solid var(--line);}
  .news-date{color:var(--muted);font-size:.9rem;}
  .news-title{font:600 1.7rem/1.15 var(--display);margin-bottom:.8rem;}
  .news-body{white-space:pre-line;max-width:66ch;overflow-wrap:anywhere;}
  .news-event{display:inline-block;margin-top:1rem;font-size:.92rem;text-decoration:underline;text-underline-offset:3px;}
  @media(max-width:768px){.news-item{grid-template-columns:1fr;gap:.6rem;}}
</style>
</head>
<body data-page="news">
<header class="page-hero">
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="crumb"><a href="https://gymwentechnik.de">Startseite</a> / News</div>
  <h1><span id="newsTitle" data-cms-key="hero.title">Aktuelle News</span></h1>
  <p class="lead" data-cms-key="hero.lead">Was bei uns los ist</p>
</header>
<main class="wrap"><div class="inner" id="newsList" aria-live="polite"><p class="empty-state">Lade…</p></div></main>

<div class="modal" id="jokeOverlay" role="dialog" aria-modal="true" aria-labelledby="jokeHead">
  <div class="modal-box">
    <button type="button" class="modal-close" id="jokeClose" aria-label="Schließen">✕</button>
    <h2 id="jokeHead">😂 Tech-Witz</h2>
    <p class="sub">Techniker-Humor für zwischendurch</p>
    <div class="modal-status" id="jokeText" style="line-height:1.6"></div>
    <button type="button" class="btn" id="jokeNext">Nächster Witz</button>
  </div>
</div>

<script type="module">
import { db, esc } from "https://gymwentechnik.de/gwt-shared.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

function fmt(ts){
  if(!ts||!ts.toDate)return '';
  const d=ts.toDate();
  return d.toLocaleDateString('de-DE')+' · '+d.toLocaleTimeString('de-DE',{hour:'2-digit',minute:'2-digit'});
}
const el=document.getElementById('newsList');
try{
  const [ns,es]=await Promise.all([getDocs(collection(db,'news')),getDocs(collection(db,'events'))]);
  const events={};es.docs.forEach(d=>{events[d.id]=d.data();});
  const items=ns.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis?.()||0)-(a.createdAt?.toMillis?.()||0));
  el.innerHTML=!items.length?'<p class="empty-state">Noch keine News vorhanden.</p>':items.map(n=>{
    const ev=n.eventId?events[n.eventId]:null;
    return '<article class="news-item"><div class="news-date">'+esc(fmt(n.createdAt))+'</div><div>'
      +'<h2 class="news-title">'+esc(n.title)+'</h2><div class="news-body">'+esc(n.body)+'</div>'
      +(ev?'<a class="news-event" href="https://gymwentechnik.de/veranstaltungen.html">Verknüpfte Veranstaltung: '+esc(ev.name)+'</a>':'')
      +'</div></article>';
  }).join('');
}catch(e){el.innerHTML='<p class="empty-state">Die News konnten nicht geladen werden. Lade die Seite neu.</p>';}
</script>

<script>
(function(){
  var JOKES=[
    "Warum mögen Bühnentechniker keinen Nebel?\nWeil er die Sicht vernebelt – aber das Publikum liebt ihn trotzdem.",
    "Wie viele Techniker braucht man, um eine Glühbirne zu wechseln?\nEinen. Aber er wartet 20 Minuten, bis der Vorführer sagt, welche Farbe.",
    "Was sagt ein Beleuchter, wenn er verliebt ist?\n'Du bringst Licht in mein Leben – aber bitte kein Blau.'",
    "Tontechniker beim Soundcheck: 'Eins, zwei...'\nRegie: 'Drei, vier?'\nTontechniker: 'Ich check Sound, keine Mathematik.'",
    "Was ist der Unterschied zwischen einem Bühnentechniker und einer Pizza?\nEine Pizza kann vier Personen ernähren.",
    "Warum schlafen Bühnentechniker so gut?\nWeil sie wissen, wie man alles auf Null dreht.",
    "Drei Dinge, die ein Techniker nie sagt:\n'Das Kabel ist lang genug.'\n'Der Akku ist voll.'\n'Der Aufbau ist fertig.'"
  ];
  var idx=0, ov=document.getElementById('jokeOverlay'), txt=document.getElementById('jokeText'), trigger=document.getElementById('newsTitle');
  function show(i){idx=(i+JOKES.length)%JOKES.length;txt.innerHTML=JOKES[idx].replace(/\n/g,'<br>');}
  function close(){ov.classList.remove('open');}
  var n=0,t=null;
  trigger.addEventListener('click',function(){
    n++;clearTimeout(t);t=setTimeout(function(){n=0;},600);
    if(n>=3){n=0;ov.classList.add('open');show(0);document.getElementById('jokeClose').focus();}
  });
  document.getElementById('jokeNext').addEventListener('click',function(){show(idx+1);});
  document.getElementById('jokeClose').addEventListener('click',close);
  ov.addEventListener('click',function(e){if(e.target===ov)close();});
  document.addEventListener('keydown',function(e){if(e.key==='Escape')close();});
})();
</script>
<script type="module" src="https://gymwentechnik.de/gwt-shared.js"></script>
<script type="module" src="https://gymwentechnik.de/gwt-theme.js"></script>
</body>
</html>
