<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://gymwentechnik.de/gwt-global.js"></script>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://gymwentechnik.de/gwt-shared.css">
<title>Galerie – GymWenTechnik</title>
<meta name="description" content="Fotos und Videos der GymWenTechnik: Einblicke hinter die Kulissen der Bühnentechnik am Gymnasium Wendelstein." />
<style>
  .chips{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:2rem;}
  .chip{background:none;border:1px solid var(--fg);color:var(--fg);border-radius:100px;padding:.4rem 1.1rem;font:500 .9rem var(--sans);cursor:pointer;}
  .chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);}
  .gal-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.6rem;}
  .gal-count{color:var(--muted);font-size:.9rem;}
  .gal-grid{columns:4 230px;column-gap:1rem;}
  .gal-item{break-inside:avoid;margin-bottom:1.2rem;}
  .gal-open{display:block;width:100%;padding:0;border:0;background:var(--line);border-radius:16px;overflow:hidden;cursor:zoom-in;}
  .gal-open img,.gal-item video{width:100%;display:block;border-radius:16px;}
  .gal-open img{transition:transform .5s var(--ease);}
  .gal-open:hover img{transform:scale(1.03);}
  .gal-meta{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;margin-top:.5rem;}
  .gal-caption{font-size:.9rem;color:var(--muted);overflow-wrap:anywhere;}
  .like{flex-shrink:0;background:none;border:1px solid var(--line);color:var(--fg);border-radius:100px;padding:.15rem .7rem;font:500 .82rem var(--sans);cursor:pointer;}
  .like[aria-pressed="true"]{background:var(--magenta);border-color:var(--magenta);color:#fff;}
  .skel{break-inside:avoid;margin-bottom:1rem;border-radius:16px;background:var(--line);animation:pulse 1.4s ease-in-out infinite;}
  @keyframes pulse{50%{opacity:.5}}
  .empty{padding:3rem 0;color:var(--muted);}
  .empty strong{display:block;font:600 1.6rem var(--display);color:var(--fg);margin-bottom:.4rem;}
  /* Lightbox + Diashow */
  .lb{display:none;position:fixed;inset:0;z-index:950;background:rgba(11,11,14,.96);color:var(--paper);flex-direction:column;align-items:center;justify-content:center;padding:4.5rem 1rem 6rem;}
  .lb.open{display:flex;}
  .lb-stage{max-width:94vw;max-height:100%;display:flex;align-items:center;justify-content:center;min-height:0;flex:1;}
  .lb-stage img,.lb-stage video{max-width:94vw;max-height:100%;object-fit:contain;border-radius:8px;}
  .lb-cap{margin-top:1rem;min-height:1.5em;text-align:center;color:#c8c8cf;max-width:70ch;}
  .lb-ctrl{position:absolute;bottom:1.4rem;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:.6rem;}
  .lb-btn{background:rgba(245,243,238,.1);border:1px solid rgba(245,243,238,.3);color:var(--paper);width:44px;height:44px;border-radius:50%;font-size:1.2rem;cursor:pointer;}
  .lb-btn:hover{background:var(--lime);color:var(--ink);}
  .lb-close{position:absolute;top:1.2rem;right:1.4rem;}
  .lb-count{min-width:5ch;text-align:center;font-size:.9rem;color:#c8c8cf;}
  .mem-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 auto 1rem;max-width:300px;}
  .mem-card{height:64px;font-size:1.5rem;background:var(--bg);border:1px solid var(--line);border-radius:12px;cursor:pointer;color:var(--fg);}
  .mem-card.found{background:var(--turq);}
</style>
</head>
<body data-page="galerie">
<header class="page-hero">
  <div class="img-slot" data-img-slot="galerie:hero"></div>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="crumb"><a href="https://gymwentechnik.de">Startseite</a> / Galerie</div>
  <h1><span id="galTitle" data-cms-key="hero.title">Unsere Galerie</span></h1>
  <p class="lead" data-cms-key="hero.lead">Einblicke hinter die Kulissen</p>
</header>

<main class="wrap"><div class="inner">
  <div class="chips" id="chips" hidden></div>
  <div id="galWrap" aria-live="polite">
    <div class="gal-grid"><div class="skel" style="height:300px"></div><div class="skel" style="height:200px"></div><div class="skel" style="height:260px"></div><div class="skel" style="height:220px"></div><div class="skel" style="height:280px"></div><div class="skel" style="height:240px"></div></div>
  </div>
</div></main>

<div class="lb" id="lb" role="dialog" aria-modal="true" aria-label="Bildansicht">
  <button type="button" class="lb-btn lb-close" id="lbClose" aria-label="Schließen">✕</button>
  <div class="lb-stage" id="lbStage"></div>
  <div class="lb-cap" id="lbCap"></div>
  <div class="lb-ctrl">
    <button type="button" class="lb-btn" id="lbPrev" aria-label="Zurück">‹</button>
    <button type="button" class="lb-btn" id="lbPlay" aria-label="Diashow starten">▶</button>
    <span class="lb-count" id="lbCount"></span>
    <button type="button" class="lb-btn" id="lbNext" aria-label="Weiter">›</button>
  </div>
</div>

<div class="modal" id="memOverlay" role="dialog" aria-modal="true" aria-labelledby="memHead">
  <div class="modal-box">
    <button type="button" class="modal-close" id="memClose" aria-label="Schließen">✕</button>
    <h2 id="memHead">🎹 Musik-Memory</h2>
    <p class="sub">Gefunden: <span id="memFound">0</span> / 8</p>
    <div class="mem-grid" id="memGrid"></div>
    <div class="modal-status" id="memStatus" aria-live="polite"></div>
    <button type="button" class="btn" id="memRestart">Neu mischen</button>
  </div>
</div>

<script type="module" src="https://gymwentechnik.de/gwt-shared.js"></script>
<script type="module">
import { db, esc } from "https://gymwentechnik.de/gwt-shared.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const $ = id => document.getElementById(id);
const safe = u => /^https:\/\//i.test(u || '') ? u : '';
const isVideo = g => g.isVideo || /\.(mp4|webm)(\?|$)|\/video\//i.test(g.url || '');
let all = [], cats = [], active = '', shown = [];
let MY = {}; try { MY = JSON.parse(localStorage.getItem('gwt_likes') || '{}'); } catch (e) {}
const saveLikes = () => { try { localStorage.setItem('gwt_likes', JSON.stringify(MY)); } catch (e) {} };

function mk(tag, cls, text) { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; }

function render() {
  const wrap = $('galWrap');
  shown = active ? all.filter(g => g.categoryId === active) : all;
  wrap.replaceChildren();
  if (!shown.length) {
    wrap.innerHTML = '<div class="empty"><strong>Noch keine Fotos</strong>Hier erscheinen bald Bilder von unseren Veranstaltungen.</div>';
    return;
  }
  const bar = mk('div', 'gal-bar');
  const play = mk('button', 'btn', 'Diashow starten'); play.type = 'button';
  play.addEventListener('click', () => openLb(0, true));
  bar.append(play, mk('span', 'gal-count', shown.length + (shown.length === 1 ? ' Eintrag' : ' Einträge')));
  const grid = mk('div', 'gal-grid');
  shown.forEach((g, i) => {
    const fig = mk('figure', 'gal-item');
    if (isVideo(g)) {
      const v = document.createElement('video');
      v.src = g.url; v.controls = true; v.muted = true; v.loop = true; v.playsInline = true; v.preload = 'metadata';
      fig.append(v);
    } else {
      const open = mk('button', 'gal-open'); open.type = 'button'; open.setAttribute('aria-label', 'Foto vergrößern' + (g.caption ? ': ' + g.caption : ''));
      const img = document.createElement('img'); img.src = g.url; img.alt = g.caption || ''; img.loading = 'lazy';
      open.append(img); open.addEventListener('click', () => openLb(i, false)); fig.append(open);
    }
    const meta = mk('div', 'gal-meta');
    meta.append(mk('figcaption', 'gal-caption', g.caption || ''));
    const like = mk('button', 'like'); like.type = 'button';
    const paint = () => { const on = !!MY[g.url]; like.textContent = '♥ ' + ((g.likes || 0) + (on ? 1 : 0)); like.setAttribute('aria-pressed', on ? 'true' : 'false'); like.setAttribute('aria-label', on ? 'Gefällt mir zurücknehmen' : 'Gefällt mir'); };
    paint();
    like.addEventListener('click', () => { MY[g.url] = !MY[g.url]; saveLikes(); paint(); });
    meta.append(like); fig.append(meta); grid.append(fig);
  });
  wrap.append(bar, grid);
}

function renderChips() {
  const el = $('chips');
  if (!cats.length) return;
  el.hidden = false; el.replaceChildren();
  [{ id: '', name: 'Alle' }, ...cats].forEach(c => {
    const b = mk('button', 'chip', c.name); b.type = 'button';
    b.setAttribute('aria-pressed', c.id === active ? 'true' : 'false');
    b.addEventListener('click', () => { active = c.id; renderChips(); render(); });
    el.append(b);
  });
}

try {
  const [gs, cs] = await Promise.all([getDocs(collection(db, 'gallery')), getDocs(collection(db, 'gallery_categories'))]);
  all = gs.docs.map(d => ({ id: d.id, ...d.data() })).filter(g => safe(g.url))
    .sort((a, b) => (b.createdAt?.toMillis?.() || 0) - (a.createdAt?.toMillis?.() || 0));
  cats = cs.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => c.name);
  const q = new URLSearchParams(location.search).get('kategorie');
  if (q && cats.some(c => c.id === q)) active = q;
  renderChips(); render();
} catch (e) { $('galWrap').innerHTML = '<p class="empty">Die Galerie konnte nicht geladen werden. Lade die Seite neu.</p>'; }

/* Lightbox + Diashow */
const lb = $('lb'); let idx = 0, timer = null, lastFocus = null;
function stage() {
  const g = shown[idx], st = $('lbStage'); st.replaceChildren();
  if (isVideo(g)) { const v = document.createElement('video'); v.src = g.url; v.controls = true; v.autoplay = true; v.muted = true; v.loop = true; v.playsInline = true; st.append(v); }
  else { const im = document.createElement('img'); im.src = g.url; im.alt = g.caption || ''; st.append(im); }
  $('lbCap').textContent = g.caption || '';
  $('lbCount').textContent = (idx + 1) + ' / ' + shown.length;
}
function step(d) { idx = (idx + d + shown.length) % shown.length; stage(); }
function setPlay(on) {
  clearInterval(timer); timer = null;
  if (on) timer = setInterval(() => step(1), 4000);
  $('lbPlay').textContent = on ? '⏸' : '▶';
  $('lbPlay').setAttribute('aria-label', on ? 'Diashow pausieren' : 'Diashow starten');
}
function openLb(i, autoplay) { lastFocus = document.activeElement; idx = i; stage(); lb.classList.add('open'); document.body.style.overflow = 'hidden'; setPlay(autoplay); $('lbClose').focus(); }
function closeLb() { setPlay(false); lb.classList.remove('open'); document.body.style.overflow = ''; $('lbStage').replaceChildren(); if (lastFocus) lastFocus.focus(); }
$('lbClose').addEventListener('click', closeLb);
$('lbPrev').addEventListener('click', () => step(-1));
$('lbNext').addEventListener('click', () => step(1));
$('lbPlay').addEventListener('click', () => setPlay(!timer));
lb.addEventListener('click', e => { if (e.target === lb || e.target === $('lbStage')) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
});

/* Easter Egg: Memory (3 schnelle Klicks auf die Überschrift) */
const EM = ['🎹','🎸','🎺','🎻','🥁','🎷','🎤','🎵'];
let first = null, lock = false, found = 0;
function initMem() {
  const deck = EM.concat(EM).sort(() => Math.random() - .5);
  first = null; lock = false; found = 0; $('memFound').textContent = '0'; $('memStatus').textContent = '';
  const g = $('memGrid'); g.replaceChildren();
  deck.forEach((em, i) => {
    const b = mk('button', 'mem-card'); b.type = 'button'; b.setAttribute('aria-label', 'Karte ' + (i + 1));
    b.addEventListener('click', () => {
      if (lock || b.textContent || b.classList.contains('found')) return;
      b.textContent = em;
      if (!first) { first = b; return; }
      lock = true; const a = first; first = null;
      setTimeout(() => {
        if (a.textContent === b.textContent) { a.classList.add('found'); b.classList.add('found'); found++; $('memFound').textContent = found; if (found === 8) $('memStatus').textContent = '🎉 Alle Paare gefunden!'; }
        else { a.textContent = ''; b.textContent = ''; }
        lock = false;
      }, 700);
    });
    g.append(b);
  });
}
const mo = $('memOverlay'); let n = 0, t = null;
$('galTitle').addEventListener('click', () => { n++; clearTimeout(t); t = setTimeout(() => n = 0, 600); if (n >= 3) { n = 0; mo.classList.add('open'); initMem(); $('memClose').focus(); } });
$('memClose').addEventListener('click', () => mo.classList.remove('open'));
$('memRestart').addEventListener('click', initMem);
mo.addEventListener('click', e => { if (e.target === mo) mo.classList.remove('open'); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') mo.classList.remove('open'); });
</script>
<script type="module" src="https://gymwentechnik.de/gwt-theme.js"></script>
</body>
</html>
