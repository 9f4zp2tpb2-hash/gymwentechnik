<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<script src="https://gymwentechnik.de/gwt-global.js"></script>
<link rel="preconnect" href="https://api.fontshare.com" crossorigin>
<link href="https://api.fontshare.com/v2/css?f[]=clash-display@400,500,600,700&f[]=general-sans@300,400,500,600,700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://gymwentechnik.de/gwt-shared.css">
<title>Veranstaltungen – GymWenTechnik</title>
<meta name="description" content="Alle Veranstaltungen und Bühnenbelegungen der GymWenTechnik am Gymnasium Wendelstein als Kalender und Liste." />
<style>
  .tools{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:2.2rem;}
  .tool{background:none;border:1px solid var(--fg);color:var(--fg);border-radius:100px;padding:.5rem 1.2rem;font:500 .92rem var(--sans);cursor:pointer;}
  .tool[aria-pressed="true"]{background:var(--fg);color:var(--bg);}
  .tool.ghost{border-color:var(--line);}
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:1rem;}
  .cal-month{font:600 clamp(1.6rem,4vw,2.4rem)/1 var(--display);}
  .cal-nav{background:none;border:1px solid var(--fg);color:var(--fg);width:44px;height:44px;border-radius:50%;font-size:1.1rem;cursor:pointer;}
  .cal-nav:hover{background:var(--lime);color:var(--ink);border-color:var(--lime);}
  .cal-wd,.cal-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));}
  .cal-wd div{padding:.5rem .4rem;font-size:.82rem;color:var(--muted);border-bottom:1px solid var(--fg);}
  .cal-day{min-height:96px;padding:.4rem;border-bottom:1px solid var(--line);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:3px;min-width:0;}
  .cal-day:nth-child(7n){border-right:0;}
  .cal-day.other{opacity:.4;}
  .cal-num{font-size:.85rem;color:var(--muted);}
  .cal-day.today .cal-num{background:var(--ink);color:var(--lime);border-radius:100px;padding:0 .5rem;align-self:flex-start;font-weight:600;}
  html.dark .cal-day.today .cal-num{background:var(--lime);color:var(--ink);}
  .pill{font-size:.72rem;line-height:1.3;padding:.1rem .45rem;border-radius:6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .pill.event{background:var(--turq);color:var(--ink);}
  .pill.buehne{background:var(--magenta);color:#fff;}
  .more{font-size:.7rem;color:var(--muted);}
  .legend{display:flex;gap:1.5rem;margin-top:1.2rem;font-size:.88rem;color:var(--muted);flex-wrap:wrap;}
  .legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:.4rem;}
  .legend .e{background:var(--turq);} .legend .b{background:var(--magenta);}
  .group{margin-bottom:4rem;}
  .group-head{display:flex;align-items:baseline;gap:1rem;border-bottom:1px solid var(--fg);padding-bottom:.6rem;margin-bottom:1.6rem;}
  .group-head h2{font:600 1.6rem/1.1 var(--display);}
  .group-head span{color:var(--muted);font-size:.9rem;}
  .ev-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:1.2rem;}
  .ev{background:var(--card);border:1px solid var(--line);border-radius:24px;overflow:hidden;display:flex;flex-direction:column;}
  .ev img{width:100%;aspect-ratio:16/10;object-fit:cover;}
  .ev-body{padding:1.5rem;display:flex;flex-direction:column;gap:.5rem;flex:1;}
  .badges{display:flex;gap:.4rem;flex-wrap:wrap;}
  .badge{border-radius:100px;padding:.1rem .75rem;font-size:.75rem;font-weight:500;border:1px solid var(--fg);}
  .badge.upcoming{background:var(--lime);color:var(--ink);border-color:var(--lime);}
  .badge.running{background:var(--turq);color:var(--ink);border-color:var(--turq);}
  .badge.buehne{background:var(--magenta);color:#fff;border-color:var(--magenta);}
  .ev-date{font-size:.88rem;color:var(--muted);}
  .ev-name{font:600 1.4rem/1.15 var(--display);overflow-wrap:anywhere;}
  .ev-desc{color:var(--muted);font-size:.95rem;overflow-wrap:anywhere;}
  .tags{display:flex;flex-wrap:wrap;gap:.4rem;}
  .ev-name a{text-decoration:none;}
  .ev-name a:hover{text-decoration:underline;text-underline-offset:4px;}
  .ev-link{margin-top:auto;padding-top:.6rem;font-size:.92rem;text-decoration:underline;text-underline-offset:3px;}
  .reaction-box{height:120px;border:1px solid var(--line);border-radius:16px;display:flex;align-items:center;justify-content:center;cursor:pointer;margin:1rem 0;color:var(--fg);background:var(--bg);width:100%;font:500 1rem var(--sans);}
  @media(max-width:640px){
    .cal-day{min-height:58px;padding:.25rem;}
    .pill{font-size:0;height:6px;padding:0;}
  }
</style>
</head>
<body data-page="veranstaltungen">
<header class="page-hero">
  <div class="img-slot" data-img-slot="veranstaltungen:banner"></div>
  <div class="blob b1"></div><div class="blob b2"></div>
  <div class="crumb"><a href="https://gymwentechnik.de">Startseite</a> / Veranstaltungen</div>
  <h1><span id="evTitle" data-cms-key="hero.title">Alle Veranstaltungen</span></h1>
  <p class="lead" data-cms-key="hero.lead">Was wir machen</p>
</header>

<main class="wrap"><div class="inner">
  <div class="tools">
    <button type="button" class="tool" id="viewCalBtn" aria-pressed="true">Kalender</button>
    <button type="button" class="tool" id="viewListBtn" aria-pressed="false">Liste</button>
    <button type="button" class="tool ghost" id="icalBtn">Als .ics herunterladen</button>
  </div>

  <section id="calView" aria-label="Kalenderansicht">
    <div class="cal-head">
      <button type="button" class="cal-nav" id="calPrev" aria-label="Vorheriger Monat">←</button>
      <div class="cal-month" id="calLabel" aria-live="polite">–</div>
      <button type="button" class="cal-nav" id="calNext" aria-label="Nächster Monat">→</button>
    </div>
    <div class="cal-wd" aria-hidden="true"><div>Mo</div><div>Di</div><div>Mi</div><div>Do</div><div>Fr</div><div>Sa</div><div>So</div></div>
    <div class="cal-grid" id="calGrid"><p class="empty-state">Lade…</p></div>
    <div class="legend"><span><i class="e"></i>Veranstaltung</span><span><i class="b"></i>Bühnenbelegung</span></div>
  </section>

  <section id="listView" hidden aria-label="Listenansicht">
    <div class="group"><div class="group-head"><h2 data-cms-key="g1.title">Anstehende Veranstaltungen</h2><span id="count-upcoming"></span></div><div class="ev-grid" id="upcoming-grid"><p class="empty-state">Lade…</p></div></div>
    <div class="group"><div class="group-head"><h2 data-cms-key="g2.title">Laufende Veranstaltungen</h2><span id="count-projects"></span></div><div class="ev-grid" id="projects-grid"><p class="empty-state">Lade…</p></div></div>
    <div class="group"><div class="group-head"><h2 data-cms-key="g3.title">Vergangene Veranstaltungen</h2><span id="count-past"></span></div><div class="ev-grid" id="past-grid"><p class="empty-state">Lade…</p></div></div>
  </section>
</div></main>

<div class="modal" id="reactionOverlay" role="dialog" aria-modal="true" aria-labelledby="reHead">
  <div class="modal-box">
    <button type="button" class="modal-close" id="reactionClose" aria-label="Schließen">✕</button>
    <h2 id="reHead">⚡ Reaktionstest</h2>
    <p class="sub">Klick so schnell wie möglich, sobald es grün wird.</p>
    <button type="button" class="reaction-box" id="reactionBox">Klick zum Starten</button>
    <div class="modal-status" id="reactionResult" aria-live="polite"></div>
  </div>
</div>

<script type="module" src="https://gymwentechnik.de/gwt-shared.js"></script>
<script type="module">
import { db, esc } from "https://gymwentechnik.de/gwt-shared.js";
import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

const STATUS = { upcoming: 'Anstehend', running: 'Läuft', done: 'Abgeschlossen' };
const MONATE = ['Januar','Februar','März','April','Mai','Juni','Juli','August','September','Oktober','November','Dezember'];
const safe = u => /^https:\/\//i.test(u || '') ? u : '';

function parseDmy(s) {
  const m = /^(\d{1,2})\.(\d{1,2})\.(\d{4})$/.exec((s || '').trim());
  if (!m) return null;
  const d = new Date(+m[3], +m[2] - 1, +m[1]); d.setHours(0, 0, 0, 0); return d;
}
const fmtLong = d => d.getDate() + '. ' + MONATE[d.getMonth()] + ' ' + d.getFullYear();
function dateLabel(ev) {
  if (ev.dateMode === 'soon') return 'Bald';
  const s = parseDmy(ev.startDate); if (!s) return ev.startDate || '';
  if (ev.dateMode === 'range') { const e = parseDmy(ev.endDate); if (e) return fmtLong(s) + ' – ' + fmtLong(e); }
  return fmtLong(s);
}
function status(ev) {
  if (ev.dateMode === 'soon') return 'upcoming';
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const s = parseDmy(ev.startDate), e = ev.dateMode === 'range' ? parseDmy(ev.endDate) : s;
  if (!s) return 'upcoming';
  if (today < s) return 'upcoming';
  if (e && today > e) return 'done';
  if (e && today >= s && today <= e) return 'running';
  return today.getTime() === s.getTime() ? 'running' : 'done';
}
const sortKey = ev => ev.dateMode === 'soon' ? Number.MAX_SAFE_INTEGER - 1 : (parseDmy(ev.startDate)?.getTime() ?? Number.MAX_SAFE_INTEGER);
function range(ev) {
  const s = parseDmy(ev.startDate); if (!s) return null;
  return [s, ev.dateMode === 'range' ? (parseDmy(ev.endDate) || s) : s];
}

let ALL = [], GAL = {}, calYear, calMonth;
const now = new Date(); calYear = now.getFullYear(); calMonth = now.getMonth();

function card(ev, st) {
  const cat = GAL[ev.id], img = safe(ev.imageUrl);
  return '<article class="ev">' + (img ? '<img src="' + esc(img) + '" alt="" loading="lazy">' : '')
    + '<div class="ev-body"><div class="badges"><span class="badge ' + st + '">' + STATUS[st] + '</span>'
    + (ev.category === 'buehne' ? '<span class="badge buehne">Bühnenbelegung</span>' : '') + '</div>'
    + '<div class="ev-date">' + esc(dateLabel(ev)) + '</div><h3 class="ev-name"><a href="https://gymwentechnik.de/veranstaltung.html?id=' + encodeURIComponent(ev.id) + '">' + esc(ev.name) + '</a></h3>'
    + '<div class="ev-desc">' + esc(ev.desc || '') + '</div>'
    + ((ev.tags || []).length ? '<div class="tags">' + ev.tags.map(t => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' : '')
    + (cat ? '<a class="ev-link" href="https://gymwentechnik.de/galerie.html?kategorie=' + encodeURIComponent(cat) + '">Fotos zu dieser Veranstaltung</a>' : '')
    + '</div></article>';
}

function renderCalendar() {
  document.getElementById('calLabel').textContent = MONATE[calMonth] + ' ' + calYear;
  const first = new Date(calYear, calMonth, 1), lead = (first.getDay() + 6) % 7;
  const days = new Date(calYear, calMonth + 1, 0).getDate(), prevDays = new Date(calYear, calMonth, 0).getDate();
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const cells = [];
  for (let i = lead - 1; i >= 0; i--) cells.push({ n: prevDays - i, other: true, d: new Date(calYear, calMonth - 1, prevDays - i) });
  for (let d = 1; d <= days; d++) cells.push({ n: d, other: false, d: new Date(calYear, calMonth, d) });
  while (cells.length % 7 !== 0 || cells.length < 35) { const n = cells.length - (lead + days) + 1; cells.push({ n, other: true, d: new Date(calYear, calMonth + 1, n) }); }
  document.getElementById('calGrid').innerHTML = cells.map(c => {
    c.d.setHours(0, 0, 0, 0);
    const evs = ALL.filter(ev => { const r = range(ev); return r && c.d >= r[0] && c.d <= r[1]; });
    return '<div class="cal-day' + (c.other ? ' other' : '') + (c.d.getTime() === today.getTime() ? ' today' : '') + '"><div class="cal-num">' + c.n + '</div>'
      + evs.slice(0, 3).map(ev => '<div class="pill ' + (ev.category === 'buehne' ? 'buehne' : 'event') + '" title="' + esc(ev.name) + '">' + esc(ev.name) + '</div>').join('')
      + (evs.length > 3 ? '<div class="more">+' + (evs.length - 3) + ' mehr</div>' : '') + '</div>';
  }).join('');
}

async function load() {
  const grids = { upcoming: ['upcoming-grid', 'count-upcoming'], running: ['projects-grid', 'count-projects'], done: ['past-grid', 'count-past'] };
  try {
    const [es, cs] = await Promise.all([getDocs(collection(db, 'events')), getDocs(collection(db, 'gallery_categories'))]);
    ALL = es.docs.map(d => ({ id: d.id, ...d.data() })).filter(ev => ev.category !== 'probe').sort((a, b) => sortKey(a) - sortKey(b));
    cs.docs.forEach(d => { const c = d.data(); if (c.eventId) GAL[c.eventId] = d.id; });
    const b = { upcoming: [], running: [], done: [] };
    ALL.forEach(ev => b[status(ev)].push(ev));
    b.done.sort((x, y) => sortKey(y) - sortKey(x));
    Object.keys(grids).forEach(k => {
      const [gid, cid] = grids[k], list = b[k];
      document.getElementById(cid).textContent = list.length + (list.length === 1 ? ' Eintrag' : ' Einträge');
      document.getElementById(gid).innerHTML = list.length ? list.map(ev => card(ev, k)).join('') : '<p class="empty-state">Keine Einträge vorhanden.</p>';
    });
    renderCalendar();
  } catch (e) {
    Object.values(grids).forEach(([gid]) => { document.getElementById(gid).innerHTML = '<p class="empty-state">Die Veranstaltungen konnten nicht geladen werden.</p>'; });
    document.getElementById('calGrid').innerHTML = '<p class="empty-state">Die Veranstaltungen konnten nicht geladen werden.</p>';
  }
}

document.getElementById('calPrev').addEventListener('click', () => { calMonth--; if (calMonth < 0) { calMonth = 11; calYear--; } renderCalendar(); });
document.getElementById('calNext').addEventListener('click', () => { calMonth++; if (calMonth > 11) { calMonth = 0; calYear++; } renderCalendar(); });

const calBtn = document.getElementById('viewCalBtn'), listBtn = document.getElementById('viewListBtn');
function view(cal) {
  document.getElementById('calView').hidden = !cal; document.getElementById('listView').hidden = cal;
  calBtn.setAttribute('aria-pressed', cal); listBtn.setAttribute('aria-pressed', !cal);
}
calBtn.addEventListener('click', () => view(true));
listBtn.addEventListener('click', () => view(false));
if (window.matchMedia('(max-width:640px)').matches) view(false); // am Handy ist die Liste lesbarer

/* ICS-Export */
const pad = n => String(n).padStart(2, '0');
const icsDate = d => d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
const icsEsc = s => (s || '').replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\n/g, '\\n');
document.getElementById('icalBtn').addEventListener('click', () => {
  const L = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//GymWenTechnik//Veranstaltungen//DE', 'CALSCALE:GREGORIAN'];
  ALL.forEach(ev => {
    const r = range(ev); if (!r) return;
    const end = new Date(r[1]); end.setDate(end.getDate() + 1);
    L.push('BEGIN:VEVENT', 'UID:' + ev.id + '@gymwentechnik.de', 'DTSTART;VALUE=DATE:' + icsDate(r[0]), 'DTEND;VALUE=DATE:' + icsDate(end),
      'SUMMARY:' + icsEsc((ev.category === 'buehne' ? '[Bühne] ' : '') + ev.name));
    if (ev.desc) L.push('DESCRIPTION:' + icsEsc(ev.desc));
    L.push('END:VEVENT');
  });
  L.push('END:VCALENDAR');
  const url = URL.createObjectURL(new Blob([L.join('\r\n')], { type: 'text/calendar;charset=utf-8' }));
  const a = document.createElement('a'); a.href = url; a.download = 'gwt-veranstaltungen.ics';
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(url);
});
load();

/* Easter Egg: Reaktionstest (3 schnelle Klicks auf die Überschrift) */
const ov = document.getElementById('reactionOverlay'), box = document.getElementById('reactionBox'), res = document.getElementById('reactionResult');
let rs = 'idle', rt = null, r0 = 0, n = 0, t = null;
function resetBox(txt) { box.style.background = ''; box.style.color = ''; box.textContent = txt || 'Klick zum Starten'; rs = 'idle'; }
document.getElementById('evTitle').addEventListener('click', () => {
  n++; clearTimeout(t); t = setTimeout(() => n = 0, 600);
  if (n >= 3) { n = 0; ov.classList.add('open'); resetBox(); res.textContent = ''; document.getElementById('reactionClose').focus(); }
});
box.addEventListener('click', () => {
  if (rs === 'idle') { rs = 'waiting'; box.style.background = '#c0392b'; box.style.color = '#fff'; box.textContent = 'Warten…';
    rt = setTimeout(() => { rs = 'go'; box.style.background = '#27ae60'; box.textContent = 'JETZT!'; r0 = Date.now(); }, 1500 + Math.random() * 3000); }
  else if (rs === 'waiting') { clearTimeout(rt); resetBox('Zu früh! Nochmal klicken'); }
  else { const ms = Date.now() - r0; resetBox(); res.textContent = ms + ' ms – ' + (ms < 200 ? '⚡ Blitz!' : ms < 350 ? '🔥 Sehr gut!' : ms < 500 ? '👍 OK' : 'Üb noch…'); }
});
const closeRe = () => { clearTimeout(rt); ov.classList.remove('open'); };
document.getElementById('reactionClose').addEventListener('click', closeRe);
ov.addEventListener('click', e => { if (e.target === ov) closeRe(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeRe(); });
</script>
<script type="module" src="https://gymwentechnik.de/gwt-theme.js"></script>
</body>
</html>
